*{box-sizing:border-box}
html{scroll-padding-top:88px}
body{margin:0;background:var(--cp-bg);color:var(--cp-text);font:18px/1.75 "Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:4px}
button,a,summary{touch-action:manipulation}
button,summary{cursor:pointer}
button{min-height:44px}
button:disabled{opacity:.5;cursor:not-allowed}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cp-accent);outline-offset:5px}
::selection{background:var(--cp-highlight);color:var(--cp-text)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:620;line-height:1.2;text-wrap:balance}
h1{font-size:42px;letter-spacing:-1.65px}
h2{font-size:23px;letter-spacing:-.5px}
h3{font-size:18px}
p+p{margin-top:18px}
.page{width:min(calc(100% - 48px),880px);margin:0 auto}
.reader{width:min(calc(100% - 48px),68ch);max-width:700px;margin:0 auto;padding:36px 0 72px}
#main-content{min-height:70vh}
#main-content:focus,h1:focus{outline:none}
.lg-svg{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.topbar{position:sticky;top:0;z-index:10;background:var(--cp-glass);backdrop-filter:blur(2px) url("#liquid-distort") saturate(150%);-webkit-backdrop-filter:blur(2px) url("#liquid-distort") saturate(150%);box-shadow:var(--cp-dome);border:none}
.topbar-inner{max-width:1040px;height:64px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font-size:17px;font-weight:650;letter-spacing:-.5px;white-space:nowrap}
.brand svg{color:var(--cp-accent)}
.topbar nav{display:flex;gap:22px;margin-left:auto}
.topbar nav a{font-size:14px;color:var(--cp-text-muted);min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.topbar nav a[aria-current="page"]{color:var(--cp-text);text-decoration:underline;text-decoration-color:var(--cp-accent);text-decoration-thickness:2px;text-underline-offset:7px}
.icon-button{width:44px;flex:0 0 44px;display:grid;place-items:center;background:none;border:none;border-radius:8px}
.icon-button:hover{background:var(--cp-surface-soft)}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 20px;border:0;border-radius:8px;font-size:15px;font-weight:650;line-height:1.5;text-decoration:none}
.primary{background:var(--cp-accent);color:var(--cp-accent-fg)}
.primary:hover:not(:disabled){background:var(--cp-accent-hover)}
.secondary{background:none;color:var(--cp-text);border:1px solid var(--cp-border-strong);font-weight:550}
.secondary:hover{background:var(--cp-surface-soft)}
.text-button{border:0;background:none;padding:10px 0;text-decoration:underline;text-underline-offset:4px;font-size:14px}
.small{font-size:13px;line-height:1.65;color:var(--cp-text-muted)}
.eyebrow{font-size:13px;color:var(--cp-text-muted);margin-bottom:14px}
.back-link{display:inline-flex;align-items:center;min-height:44px;font-size:13px;color:var(--cp-text-muted);margin-bottom:10px;text-decoration:none}
.back-link::before{content:"\2190";margin-right:9px}
.back-link:hover{text-decoration:underline}
.course-page{padding:48px 0 64px}
.course-intro{max-width:650px;padding-bottom:42px}
.course-intro h1{font-size:50px;max-width:18ch;line-height:1.08;letter-spacing:-2px}
.course-lead{font-size:20px;line-height:1.6;max-width:47ch;margin:22px 0 24px}
.course-guidance{font-size:14px;color:var(--cp-text-muted);max-width:57ch;margin-top:16px}
.course-progress{font-size:13px;color:var(--cp-text-muted);margin-top:12px}
.chapter{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;padding:28px 0;border-top:1px solid var(--cp-border)}
.chapter-heading{display:flex;align-items:flex-start;gap:16px}
.chapter-number{font-size:13px;color:var(--cp-text-soft);line-height:28px;min-width:18px}
.chapter h2{font-size:23px;margin-bottom:9px}
.chapter-heading p{font-size:14px;line-height:1.65;color:var(--cp-text-muted);max-width:28ch}
.lesson-menu{list-style:none;padding:0;margin:0;counter-reset:none}
.lesson-menu li+li{border-top:1px solid var(--cp-border)}
.lesson-menu a{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:52px;font-size:15px;text-decoration:none;padding:10px 0}
.lesson-menu a:hover{color:var(--cp-accent)}
.lesson-menu-end{flex-shrink:0;color:var(--cp-text-muted)}
.completion-label{font-size:11px;color:var(--cp-success)}
.course-boundary{border-top:1px solid var(--cp-border);padding-top:24px;margin-top:8px;font-size:12px;line-height:1.7;color:var(--cp-text-muted)}
.lesson-location{font-size:12px;color:var(--cp-text-muted);margin:0 0 10px}
.lesson-location span{margin-inline:8px;color:var(--cp-text-soft)}
.lesson-header h1{font-size:38px;max-width:26ch}
.lesson-outcome{font-size:14px;color:var(--cp-text-muted);margin-top:14px}
.phase-nav{display:flex;gap:32px;border-bottom:1px solid var(--cp-border);margin:26px 0 28px}
.phase-nav a{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 0 12px;font-size:14px;color:var(--cp-text-muted);text-decoration:none;border-bottom:2px solid transparent}
.phase-nav a span{font-size:10px;border:1px solid var(--cp-border-strong);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;line-height:1}
.phase-nav a[aria-current="step"]{color:var(--cp-text);border-bottom-color:var(--cp-accent)}
.phase-nav a[aria-current="step"] span{border-color:var(--cp-accent);background:var(--cp-accent-soft);color:var(--cp-accent)}
.lesson-idea{font-size:22px;line-height:1.6;letter-spacing:-.3px;margin-bottom:22px}
.core-explanation{color:var(--cp-text-muted);font-size:17px;line-height:1.8}
.worked-example{margin:30px 0;padding:24px;background:var(--cp-bg-elevated);border-radius:8px}
.worked-example h2{font-size:17px;margin-bottom:15px;letter-spacing:-.2px}
.worked-example p{font-size:16px;line-height:1.8}
.worked-example .case-context{font-size:14px;color:var(--cp-text-muted);margin-bottom:16px}
.example-contrast{margin:22px 0 0;font-size:16px}
.example-contrast div+div{margin-top:18px;padding-top:18px;border-top:1px solid var(--cp-border)}
.example-contrast dt{font-size:12px;color:var(--cp-text-muted);margin-bottom:5px}
.example-contrast dd{margin:0;line-height:1.7}
.lesson-caution{font-size:14px;color:var(--cp-text-muted);line-height:1.75}
.lesson-caution strong{color:var(--cp-text);font-weight:600}
details summary{min-height:44px;padding:11px 0;font-size:14px;line-height:1.6}
details p{font-size:16px;line-height:1.8;color:var(--cp-text-muted);margin:12px 0}
.deeper{margin-top:18px}
.phase-forward{margin-top:30px}
.phase-forward .small{margin-top:12px}
.lesson-source{font-size:12px;line-height:1.75;color:var(--cp-text-soft);margin-top:28px;padding-top:18px;border-top:1px solid var(--cp-border)}
.lesson-phase>h2{font-size:25px;line-height:1.3;margin:0 0 14px}
.lesson-phase>h2+p{color:var(--cp-text-muted);font-size:16px}
.editor{margin-top:26px}
.editor label{display:block;font-size:17px;line-height:1.65;font-weight:550;margin-bottom:12px}
textarea{display:block;width:100%;min-height:180px;resize:vertical;padding:16px;font-size:16px;line-height:1.75;border:1px solid var(--cp-border-strong);border-radius:8px;background:var(--cp-bg);color:var(--cp-text)}
textarea::placeholder{color:var(--cp-text-soft);opacity:1}
#recall-note{min-height:128px}
.save-state{display:block;font-size:12px;color:var(--cp-text-muted);margin-top:9px}
.choices{margin-top:28px}
.choices>summary{display:inline-flex;align-items:center;min-height:48px;padding:11px 20px;background:var(--cp-accent);color:var(--cp-accent-fg);border-radius:8px;font-size:15px;font-weight:650;list-style:none}
.choices>summary::-webkit-details-marker{display:none}
.choices[open]>summary{background:none;color:var(--cp-text-muted);padding:10px 0;font-size:13px;font-weight:400;text-decoration:underline}
fieldset{padding:0;margin:20px 0;border:0;min-width:0}
legend{padding:0;margin-bottom:18px;font-size:19px;line-height:1.6;font-weight:550}
.answer{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--cp-border);border-radius:8px;margin:10px 0;cursor:pointer;font-size:16px;line-height:1.7;min-height:48px}
.answer input{margin:6px 0 0;width:17px;height:17px;accent-color:var(--cp-accent);flex-shrink:0}
.answer:has(input:checked){background:var(--cp-accent-soft);border-color:var(--cp-accent)}
.feedback{padding:18px 0;font-size:16px;line-height:1.75}
.feedback[data-result="incorrect"]{color:var(--cp-warning)}
.check-passed{font-size:14px;color:var(--cp-text-muted);margin:22px 0 14px}
.quiet-back{display:block;font-size:13px;color:var(--cp-text-muted);margin-top:24px;min-height:44px;padding:10px 0}
.guidance{margin-top:22px}
.guidance ol{padding-left:22px;font-size:16px;line-height:1.8;color:var(--cp-text-muted)}
.guidance li+li{margin-top:8px}
.guidance h3{margin-top:20px;font-size:15px}
.lesson-done{padding-top:40px}
.lesson-done h1{margin-bottom:30px}
.lesson-done h2{font-size:16px;margin-bottom:12px}
.saved-decision{font-size:21px;line-height:1.7;white-space:pre-line;border-left:2px solid var(--cp-accent);padding-left:22px;margin-bottom:20px}
.notebook-page,.lab-page{padding:36px 0 64px}
.page-lead{font-size:18px;color:var(--cp-text-muted);max-width:62ch;line-height:1.7;margin-top:18px}
.notebook-tools{display:flex;align-items:center;flex-wrap:wrap;gap:24px;margin:26px 0 18px}
.notebook-entries{margin-top:32px}
.notebook-entry{border-top:1px solid var(--cp-border)}
.notebook-entry:last-child{border-bottom:1px solid var(--cp-border)}
.notebook-entry>summary{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:17px 0;font-size:16px;list-style:none}
.entry-status{font-size:12px;color:var(--cp-text-muted);white-space:nowrap}
.notebook-entry[open]{padding-bottom:24px}
.notebook-entry[open]>summary{font-weight:600}
.notebook-entry .editor{margin-top:10px}
.entry-lesson{display:inline-block;min-height:44px;padding:10px 0;font-size:13px;color:var(--cp-text-muted)}
.recall-review p{white-space:pre-line}
.storage-tools{margin-top:32px}
.storage-tools button{margin:12px 12px 0 0}
.sources-page h1{margin-bottom:18px}
.source-boundary{margin:32px 0}
.source-boundary h2{font-size:21px;margin-bottom:16px}
.source-boundary p{font-size:16px;line-height:1.8;color:var(--cp-text-muted)}
.reading-list{padding-left:22px}
.reading-list li{padding:18px 0 18px 6px;border-top:1px solid var(--cp-border)}
.reading-list li>a{font-size:17px;font-weight:550}
.reading-list span{display:block;font-size:14px;color:var(--cp-text-muted);margin-top:5px}
.reading-list li p{font-size:12px;line-height:1.7;color:var(--cp-text-soft);margin-top:5px}
.sources-page>.secondary{margin-top:24px}
.storage-error{width:min(calc(100% - 48px),880px);margin:22px auto;padding:16px;border:1px solid var(--cp-warning);font-size:14px;line-height:1.7}
.footer{display:flex;gap:20px;flex-wrap:wrap;padding:24px 0 32px;border-top:1px solid var(--cp-border);font-size:12px;color:var(--cp-text-muted)}
.footer>span{margin-right:auto}
.footer>a{min-height:44px;display:flex;align-items:center}
.footer>span{display:flex;align-items:center;min-height:44px}
.learning-visual{margin-top:22px}
.example-switch{display:flex;border-bottom:1px solid var(--cp-border);gap:20px;margin-bottom:18px}
.example-switch button{background:none;border:0;border-bottom:2px solid transparent;color:var(--cp-text-muted);padding:8px 0;min-height:48px;font-size:14px;line-height:1.5;text-align:left}
.example-switch button[aria-pressed="true"]{color:var(--cp-text);border-bottom-color:var(--cp-accent)}
.question-example>span,.question-result>span{font-size:12px;color:var(--cp-text-muted)}
.question-example p{font-size:21px;line-height:1.55;margin:6px 0 18px;letter-spacing:-.4px}
.question-result{border-left:2px solid var(--cp-border-strong);padding-left:16px}
.question-result p{font-size:16px;line-height:1.75;margin:6px 0 0}
.worked-example .visual-hint{font-size:12px;color:var(--cp-text-soft);margin:18px 0 0}
.scope-drawing{width:100%;height:auto}
.scope-line{stroke:var(--cp-accent);stroke-width:1.6;fill:none}
.scope-core rect{fill:var(--cp-surface);stroke:var(--cp-border-strong);stroke-width:1}
.scope-core text{fill:var(--cp-text);font-size:14px}
.scope-extra{opacity:.14}
.expanded .scope-extra{opacity:1}
.scope-extra path{fill:none;stroke:var(--cp-border-strong);stroke-width:1;stroke-dasharray:3 4}
.scope-extra rect{fill:var(--cp-bg);stroke:var(--cp-border);stroke-width:1}
.scope-extra text{fill:var(--cp-text-muted);font-size:13px}
.scope-key{display:none}
.worked-example .scope-explanation,.worked-example .scope-extras{font-size:14px;color:var(--cp-text-muted);line-height:1.75}
.visual-error{font-size:14px;padding:16px;border:1px solid var(--cp-warning)}
.related-guide{margin-top:18px}
.economics-explorer{margin-top:22px;padding-top:12px;border-top:1px solid var(--cp-border)}
.economics-explorer>summary{font-weight:550}
.economics-explorer .small{margin:12px 0}
#economics-form{margin-top:20px}
.numeric-field{display:grid;grid-template-columns:minmax(0,1fr) 140px;align-items:center;gap:20px;margin:12px 0}
.numeric-field label{font-size:14px;line-height:1.65}
.numeric-field input{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--cp-border-strong);border-radius:7px;background:var(--cp-bg);color:var(--cp-text);font:inherit;font-size:16px}
.example-actions{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:22px}
.calculation-error{font-size:14px;color:var(--cp-warning);line-height:1.7;margin:16px 0}
.calculation-rows{margin:24px 0}
.calculation-rows>div{display:flex;gap:20px;align-items:center;justify-content:space-between;border-top:1px solid var(--cp-border);padding:14px 0}
.calculation-rows dt{font-size:15px;line-height:1.65}
.calculation-rows dt small{display:block;font-size:12px;color:var(--cp-text-muted);margin-top:4px}
.calculation-rows dd{margin:0;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.calculation-rows>div:last-child{border-block:1px solid var(--cp-border-strong)}
.break-even{font-size:15px;color:var(--cp-text-muted);line-height:1.75}

  <script>const course={"id":"levers","title":"Business Levers","storageKey":"business-levers-v1","exportName":"business-levers","eyebrow":"A companion to @thelazyceo's reel","heading":"Understand the business before you automate it.","lead":"Follow the sale, account for its cost, and choose one assumption to test.","guidance":"Use one real business idea throughout. All example figures are invented for learning, not targets or forecasts.","sourceCredit":"An original companion to the reel's business-levers theme.","sourceHeading":"Sources and limits","sourceIntro":"The reel supplied the theme. The lessons, arithmetic model, and practice questions are original and use the primary references below.","sourceParagraphs":["The public reel by @thelazyceo says online businesses follow a similar path and involve levers that AI can help you work faster. Its visible headline makes a personal earnings claim, but does not define whether that means revenue or profit. The reel offers a business guide through a CLAUDE comment.","We did not obtain that promised guide, a step-by-step method, or evidence for the personal earnings claim. This course is not a reconstruction of the creator's guide. The levers taught here are an independently selected teaching model, not a list extracted from the video.","The worked example is a fictional online service. All dollar amounts, visits, orders, rates, and time budgets are illustrative assumptions. No earnings claim, market benchmark, guaranteed outcome, or investment recommendation is implied.","The arithmetic holds other inputs constant to explain relationships. It does not establish that more traffic keeps conversion unchanged, that a price rise leaves demand intact, or that AI can replace customer evidence.","The economics example is a simplified operating model, not financial reporting. Tax, financing, founder pay, depreciation, refunds, and other costs need separate treatment or explicit inclusion before making a real decision."],"reelUrl":"https://www.instagram.com/reels/DerBPXstdkj/","checkedDate":"20 October 2026","caseContext":"Our fictional online service sells a reviewed content brief to independent instructors. The customer checks and approves the work before using it.","printIntro":"Original learning companion inspired by @thelazyceo's business-levers reel. The promised guide and supporting earnings evidence were not publicly available. All figures in the worked example are illustrative.","exportIntro":"Original companion inspired by @thelazyceo's reel.\nThe promised guide was not publicly available. These are independently developed lessons, not the creator's method.","otherGuide":{"url":"../","label":"Founder Fieldwork: customer discovery and pilots"},"lab":false,"calculator":true};
const lessons=[{"id":"claim","group":"Check the starting point","short":"Read the claim carefully","title":"A revenue number does not tell you what the owner kept.","author":"Stripe","resource":"How to calculate the break-even point","url":"https://stripe.com/resources/more/how-to-calculate-the-break-even-point","origin":"Added teaching reference; not identified as a resource in the reel","idea":"Before learning from an earnings claim, ask what was measured, over what period, and after which costs.","paragraphs":["Revenue is the value of sales. A cost is what the business spends to make and support those sales. Profit depends on which costs have been deducted. Cash received is another question: a sale can be recorded before the customer pays, and a payment can arrive before you deliver.","Ask for the currency, period, business activity, refunds, costs, and the evidence behind the number. A personal result is one person's account, not a forecast for you. The useful lesson is how a business works, not a target you must copy."],"case":"Imagine an online service with $1,000 in sales for one month. It spends $300 delivering orders, $200 acquiring customers, and $400 on fixed costs. The modeled remainder is $100 before tax and any omitted costs. Saying it made $1,000 would leave the most important part unclear.","distinction":["Sales","$1,000 of revenue in the example month.","Modeled remainder","$100 after the example's specified costs, before tax and omitted items."],"task":"Write the questions you would ask before trusting an earnings claim.","steps":["Name the metric, currency, and period.","Ask which costs and refunds are included.","Separate what was shown from what you are assuming."],"prompt":"Which number are you trying to understand, what does it include, and what evidence is missing?","example":"I need monthly revenue, direct delivery costs, acquisition costs, fixed costs, refunds, and owner pay separately. A screenshot of sales alone will not answer what the business keeps.","trap":"Do not infer the creator's costs or actual profit. The reel's personal claim has not been verified here.","quiz":{"question":"A screenshot shows $10,000 in payments received. What can you conclude?","options":["The owner earned $10,000 in profit.","You need the period, refunds, delivery obligations, and costs before judging earnings.","Every similar business can reach the same result."],"correct":1,"explanations":["Payments received do not show expenses, refunds, or unfinished obligations.","The screenshot alone cannot establish profit or what the owner can take home.","One account cannot establish a transferable outcome for another business."]},"takeaway":"Name the metric before you borrow the ambition."},{"id":"buyer","group":"Check the starting point","short":"Find a buyer with a real problem","title":"A reachable buyer comes before a traffic target.","author":"Rob Fitzpatrick","resource":"The Mom Test","url":"https://www.momtestbook.com/","origin":"Added teaching reference; not identified as a resource in the reel","idea":"Find someone with a problem they already spend effort solving. Then test a small, clear offer.","paragraphs":["A buyer is not simply everyone who might like the idea. Choose a person you can reach, a task they struggle with, and an outcome you can safely deliver. Ask about their last attempt before presenting your product. Their actual workaround gives you a starting point.","Interest, a request for information, a completed trial, and payment are different observations. Record them separately. You can use AI to help prepare questions, but generated customer quotes or personas cannot replace conversations with real people."],"case":"Our fictional service could promise AI content for everyone. A narrower test is a reviewed brief for an independent instructor preparing a course launch. Ask how they prepared the last launch, what took time, and whether they already paid someone to help.","distinction":["An audience category","Anyone building a personal brand.","A testable buyer situation","An independent instructor preparing a course launch who can describe the last preparation process."],"task":"Name a reachable buyer and a small offer.","steps":["Choose a person or group you can actually contact.","Ask about the most recent occurrence of the problem.","Describe a limited outcome, permissions, and delivery terms."],"prompt":"Who will you talk to, what recent problem will you investigate, and what small result could you offer?","example":"I will ask an independent instructor about their last launch brief. If the preparation was painful, I will offer one reviewed brief using permitted inputs, with the scope and price agreed first.","trap":"A polite yes is not a purchase. Do not pressure people or treat a fictional persona as observed demand.","quiz":{"question":"Which observation is the strongest starting point for investigation?","options":["A person shows the process they used to prepare their last launch.","AI estimates that many people might want content help.","Friends like the name of your service."],"correct":0,"explanations":["A recent process gives you something real to inspect. You still need to investigate cost and urgency.","A generated estimate does not establish a customer's behavior or buying decision.","Branding feedback does not show a recurring problem."]},"takeaway":"Find the job before you count the visitors."},{"id":"funnel","group":"Follow the money","short":"Connect visits to sales","title":"Make the path from attention to an order explicit.","author":"Shopify","resource":"Ecommerce conversion rate","url":"https://www.shopify.com/blog/ecommerce-conversion-rate","origin":"Added teaching reference; not identified as a resource in the reel","idea":"For a simple order funnel, visits multiplied by the order rate gives modeled orders. Orders multiplied by average net revenue gives modeled revenue.","paragraphs":["Choose one period and one denominator. In this guide, the order rate is completed orders divided by site visits in that same period. A visit is a session, not a unique person. One person may visit several times. Do not replace visits with followers or total registered users.","This is a simple direct-sale teaching model. Some businesses need extra stages such as a qualified lead, a sales call, or an approval. Label the stages and use matching periods before comparing rates. Improving a metric requires a test; changing a number in a model is not evidence you can achieve it."],"case":"With 1,000 visits and 20 completed orders, the example order rate is 20 / 1,000 = 2%. At $50 average net revenue per order, modeled revenue is $1,000. Raising the rate to 3% while holding everything else constant gives 30 modeled orders and $1,500 revenue.","distinction":["A defined rate","20 orders / 1,000 visits in one month = 2%.","An incompatible denominator","20 orders / everyone who has ever followed the account."],"task":"Write a small funnel with clearly labeled stages.","steps":["Define the start, the completed action, and the period.","Use the same population and period in numerator and denominator.","Choose one possible source of friction to investigate."],"prompt":"What starts your funnel, what counts as a completed sale, and which rate could you measure honestly?","example":"I will count visits to the pilot-offer page and completed paid orders during the same month. I will keep requests for information separate from purchases.","trap":"A higher order rate can reflect a different audience or mix of visitors. It does not automatically prove the page improved.","quiz":{"question":"You have 800 visits and 16 completed orders in one period. What is the order rate?","options":["16%.","50%.","2%."],"correct":2,"explanations":["16 is the order count, not the percentage of visits.","Dividing visits by orders reverses the question.","16 / 800 = 0.02, which is 2%. Keep the numerator and denominator labeled."]},"takeaway":"Every rate needs an action, a denominator, and a period."},{"id":"economics","group":"Follow the money","short":"Check what each sale leaves","title":"More orders help only when the economics support them.","author":"Stripe","resource":"Break-even analysis and contribution","url":"https://stripe.com/resources/more/how-to-calculate-the-break-even-point","origin":"Added teaching reference; not identified as a resource in the reel","idea":"Subtract the cost that grows with each order before deciding how much more volume is worth.","paragraphs":["Variable cost grows with delivery: payment fees, materials, model usage, or review work may belong here. Contribution per order is net revenue per order minus variable cost per order. Total contribution still has to cover acquisition spending and fixed costs before the modeled business has a surplus.","Customer acquisition cost, or CAC, is matched sales and marketing cost divided by new customers acquired. It is not cost divided by every order, signup, or existing customer. In a simple acquisition-period view, $200 for 10 new customers is $20 per new customer. Long sales cycles require careful timing and attribution. Do not subtract the same acquisition expense twice."],"case":"In the example month, 20 orders at $50 produce $1,000 revenue. Delivery costs are $15 per order, or $300 total. The $700 contribution then covers $200 acquisition spending and $400 fixed costs, leaving $100 before tax and omitted costs. If variable cost rises above $50 per order, selling more adds loss before those fixed costs.","distinction":["Contribution per order","$50 net revenue - $15 variable cost = $35.","Modeled monthly remainder","20 x $35 - $200 acquisition spending - $400 fixed costs = $100."],"task":"List costs before deciding to buy more traffic.","steps":["Name the costs that grow with each order.","List the period's acquisition spending and fixed costs separately.","Check whether owner time, refunds, taxes, and other expenses are missing."],"prompt":"What is left from one order, which other costs must it cover, and what is still missing from your estimate?","example":"A $50 brief with $15 variable delivery cost contributes $35 before acquisition and fixed costs. I still need to account for my review time, refunds, and tax before judging real earnings.","trap":"The explorer is a simplified model, not a profit forecast. A traffic or price change may also change acquisition costs, conversion, support load, and refunds.","quiz":{"question":"Net revenue is $40 per order and variable delivery cost is $45. What happens if orders rise while those figures stay the same?","options":["Each additional order adds $5 of loss before acquisition and fixed costs.","Volume automatically fixes the loss.","The business breaks even after any fixed number of orders."],"correct":0,"explanations":["Contribution is $40 - $45 = -$5. More of the same orders makes that part of the loss larger.","Negative contribution is not repaired by multiplying it.","There is no volume that covers positive fixed costs with negative contribution under these assumptions."]},"takeaway":"Inspect contribution before you scale the order count."},{"id":"repeat","group":"Improve one thing at a time","short":"Look for a reason to return","title":"A second purchase needs a second reason to buy.","author":"Rahul Vohra / First Round Review","resource":"How Superhuman Built an Engine to Find Product Market Fit","url":"https://review.firstround.com/how-superhuman-built-an-engine-to-find-product-market-fit/","origin":"Added teaching reference; not identified as a resource in the reel","idea":"Look for return behavior when the customer needs the outcome again. Do not assume every customer buys on a fixed schedule.","paragraphs":["A cohort is a group defined by a shared starting point, such as the month of a first purchase. To investigate return use, compare customers who actually reached another opportunity to use the service. Record the outcome and ask why people returned or did not return.","A subscription, a one-off service, and a repeat-purchase store have different cadences. A monthly charge does not prove monthly value. Avoid turning a short, small pilot into a lifetime-value estimate or assuming a survey benchmark proves product-market fit."],"case":"Of 10 instructors who bought a brief, only four have another launch during the observation window. Two buy again. That is two repeat buyers out of four eligible customers, or 50% for this small eligible group. It is also two out of the original 10, or 20% of that cohort. Both are labeled facts; they answer different questions.","distinction":["Eligible return rate","2 repeat buyers / 4 with another launch = 50% in this example.","Original-cohort repeat share","2 repeat buyers / 10 initial buyers = 20% over the observation window."],"task":"Define the next real opportunity to buy again.","steps":["Name the event that creates another customer need.","Separate eligible customers from those not yet due to return.","Ask returners and non-returners what happened."],"prompt":"When should your customer need this again, who would be eligible, and what would you observe?","example":"I will look at instructors with another launch during the next observation window. I will report both the original cohort and the eligible subset, then ask why they did or did not buy.","trap":"The example percentages come from tiny invented counts. They are not benchmarks or stable estimates of future retention.","quiz":{"question":"Three of 12 initial buyers face the job again, and one buys again. Which report is clearest?","options":["Retention is definitely 33%, without qualification.","All 12 customers had an equal reason to return.","One of three eligible buyers returned; also report one of 12 original buyers over the window."],"correct":2,"explanations":["The small sample and eligibility definition change what the number means.","The scenario says only three faced the job again.","Both denominators are useful when labeled. Neither tiny fraction is a universal retention rate."]},"takeaway":"Count returns against a real opportunity to return."},{"id":"ai-test","group":"Improve one thing at a time","short":"Use AI on a testable task","title":"Use AI to shorten the work, not to invent the evidence.","author":"Anthropic with Rick Dakan and Joseph Feller","resource":"AI Fluency: Framework and foundations","url":"https://academy.claude.com/courses/ai-fluency-framework-foundations","origin":"Added teaching reference; not identified as a resource in the reel","idea":"Give AI a bounded task, review the result, and measure whether the total workflow improved.","paragraphs":["Claude or another AI tool can help draft interview questions, organize permitted notes, explain formulas, or produce a first draft of an offer. You remain responsible for the claims and the decision. State the task, allowed inputs, constraints, and how you will check the output.","Measure total time including preparation, checking, and rework. A faster draft can create more work if errors reach the customer. Keep sensitive data out unless you have the right permissions and an appropriate data-handling setup. Do not send campaigns, spend money, or change customer records without deliberate approval."],"case":"An invented manual workflow takes 40 minutes per brief. An AI-assisted attempt takes eight minutes to draft and 37 minutes to check and repair. Total time is 45 minutes, so it is not faster. Try a narrower drafting task and compare reviewed outputs before rolling it out.","distinction":["Misleading speed claim","The draft took eight minutes instead of 40.","Full workflow comparison","Eight minutes drafting + 37 minutes reviewing = 45 minutes, versus 40 before."],"task":"Plan one bounded AI-assisted experiment.","steps":["Choose a repeated task and define acceptable output.","Use permitted or fictional inputs and review against the same standard.","Compare total time, errors, and customer usefulness; write a stop rule."],"prompt":"Which task will you test, what evidence will you use, and what result would make you keep, change, or stop the approach?","example":"Use fictional inputs to draft a launch brief. Require a human check for unsupported claims, scope, and accuracy. Compare total reviewed time against the manual process. Stop if review costs cancel the time saved.","trap":"Generated interviews, fake testimonials, and model confidence are not customer evidence. No AI prompt establishes demand or guarantees earnings.","quiz":{"question":"AI drafts an offer in five minutes but it takes 30 more minutes to fix. The manual process took 25 minutes. Which comparison is valid?","options":["AI was five times faster because drafting took five minutes.","The AI-assisted workflow took 35 minutes, so it was slower on this attempt.","The checking time should be ignored because it is human work."],"correct":1,"explanations":["That comparison ignores the work required to make the draft usable.","Count drafting and review together, and compare quality under the same standard.","Review is part of the delivery process and must be counted."]},"takeaway":"Keep the faster workflow only after counting the whole job."}];

function evaluateSignal(signal, answer) {
  if (!categories.includes(answer)) throw new RangeError("Choose a valid evidence category.");
  return { correct: signal.category === answer, category: signal.category, explanation: signal.why, next: signal.next };
}

function emptyProgress() {
  return { version: 1, notes: {}, recalls: {}, passed: [], completed: [], theme: "dark" };
}

function parseProgress(raw, ids) {
  const saved = JSON.parse(raw);
  if (!saved || saved.version !== 1 || typeof saved.notes !== "object" || saved.notes === null ||
      Array.isArray(saved.notes) || !Array.isArray(saved.passed) || !Array.isArray(saved.completed) ||
      !["dark", "light"].includes(saved.theme)) {
    throw new TypeError("Saved field notes have an unsupported format.");
  }
  if(saved.recalls!==undefined&&(typeof saved.recalls!=="object"||saved.recalls===null||Array.isArray(saved.recalls))) {
    throw new TypeError("Saved recall notes have an unsupported format.");
  }
  const notes = {},recalls={};
  for (const id of ids) {
    if (Object.hasOwn(saved.notes, id)) {
      if (typeof saved.notes[id] !== "string") throw new TypeError("A saved field note is not text.");
      notes[id] = saved.notes[id];
    }
    if(saved.recalls&&Object.hasOwn(saved.recalls,id)) {
      if(typeof saved.recalls[id]!=="string")throw new TypeError("A saved recall note is not text.");
      recalls[id]=saved.recalls[id];
    }
  }
  const passed = [...new Set(saved.passed.filter(id => ids.includes(id)))];
  const completed = [...new Set(saved.completed.filter(id => ids.includes(id) && passed.includes(id) && notes[id]?.trim()))];
  return { version: 1, notes, recalls, passed, completed, theme: saved.theme };
}

function canComplete(state, id) {
  return state.passed.includes(id) && Boolean(state.notes[id]?.trim());
}

function makeNotebook(lessons, state, courseInfo) {
  const title=courseInfo?courseInfo.title:"Founder Fieldwork";
  const intro=courseInfo?courseInfo.exportIntro:"Original companion course inspired by @davecto's reel.\nThe full nine-resource list was not publicly visible. This is an independently curated selection.";
  const lines = [`# ${title}`, "", intro, "", "Personal notes exported from this browser. Course completion is not business validation.", ""];
  for (const lesson of lessons) {
    lines.push(`## ${lesson.short}`, "", `${lesson.author}: ${lesson.resource}`, lesson.url, "", `Practice: ${lesson.task}`, "", state.notes[lesson.id]?.trim() || "(No note yet.)", "", `Practice complete: ${state.completed.includes(lesson.id) ? "yes" : "no"}`, "");
    if(state.recalls?.[lesson.id]?.trim())lines.push("Recall note:",state.recalls[lesson.id],"");
  }
  return lines.join("\n");
}

const lessonPhases=["learn","check","apply"];
function parseLearningRoute(hash,ids) {
  const value=hash.replace(/^#/,"");
  if(!value||value==="course")return {view:"course"};
  if(["notebook","sources","lab"].includes(value))return {view:value};
  if(value==="resources")return {view:"sources"};
  const params=new URLSearchParams(value);
  const id=params.get("lesson"),phase=params.get("step")||"learn";
  if(ids.includes(id)&&[...lessonPhases,"done"].includes(phase))return {view:"lesson",id,phase};
  return {view:"not-found"};
}
function lessonHref(id,phase="learn") {
  if(![...lessonPhases,"done"].includes(phase))throw new RangeError("Unknown lesson phase.");
  return `#lesson=${encodeURIComponent(id)}${phase==="learn"?"":`&step=${phase}`}`;
}
function nextUnfinishedLesson(lessons,state) {
  return lessons.find(l=>!state.completed.includes(l.id))||lessons[0];
}
function resumePhase(id,state) {
  return state.passed.includes(id)?"apply":state.recalls?.[id]?.trim()?"check":"learn";
}

const exampleInputs={visits:1000,rate:2,price:50,variable:15,acquisition:200,fixed:400};
const economicsFields=[
  {id:"visits",label:"Site visits in one month",value:1000,min:0,max:10000000,step:1},
  {id:"rate",label:"Completed-order rate (%)",value:2,min:0,max:100,step:0.1},
  {id:"price",label:"Average net revenue per order (USD)",value:50,min:0,max:1000000,step:0.01},
  {id:"variable",label:"Variable cost per order (USD)",value:15,min:0,max:1000000,step:0.01},
  {id:"acquisition",label:"Acquisition spending this month (USD)",value:200,min:0,max:100000000,step:0.01},
  {id:"fixed",label:"Other fixed costs this month (USD)",value:400,min:0,max:100000000,step:0.01}
];
function calculateEconomics(input) {
  for(const field of economicsFields) {
    const value=input[field.id];
    if(typeof value!=="number"||!Number.isFinite(value)||value<field.min||value>field.max)throw new RangeError(`${field.label} must be between ${field.min} and ${field.max}.`);
    if(field.id==="visits"&&!Number.isInteger(value))throw new RangeError("Site visits must be a whole number.");
    if(!["visits","rate"].includes(field.id)&&Math.abs(value*100-Math.round(value*100))>0.00001)throw new RangeError(`${field.label} must use no more than two decimal places.`);
  }
  const priceCents=Math.round(input.price*100),variableCents=Math.round(input.variable*100);
  const periodCostCents=Math.round(input.acquisition*100)+Math.round(input.fixed*100);
  const orders=input.visits*input.rate/100;
  const revenue=orders*priceCents/100,variableCost=orders*variableCents/100;
  const contributionPerOrder=(priceCents-variableCents)/100;
  const contribution=revenue-variableCost;
  const periodCost=periodCostCents/100;
  const surplus=contribution-periodCost;
  const breakEvenOrders=priceCents>variableCents?Math.ceil(periodCostCents/(priceCents-variableCents)):null;
  return {orders,revenue,variableCost,contributionPerOrder,contribution,periodCost,surplus,breakEvenOrders};
}

const money=value=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2}).format(value);
const quantity=value=>new Intl.NumberFormat("en-US",{maximumFractionDigits:6}).format(value);
function calculatorMarkup() {
  return `<details class="economics-explorer"><summary>Try the arithmetic with different assumptions</summary><p class="small">One illustrative month, in USD. These inputs are invented. Change one at a time to understand the relationship, not to predict your earnings.</p>
  <form id="economics-form">${economicsFields.map(f=>`<div class="numeric-field"><label for="econ-${f.id}">${f.label}</label><input id="econ-${f.id}" name="${f.id}" type="number" value="${f.value}" min="${f.min}" max="${f.max}" step="${f.step}" required></div>`).join("")}
  <div class="example-actions"><button class="secondary" type="submit">Calculate this example</button><button id="reset-example" class="text-button" type="button">Restore the example</button></div><p id="economics-error" class="calculation-error" role="alert" hidden></p></form>
  <section id="economics-results" aria-label="Illustrative economics result" aria-live="polite"></section>
  <p class="small">Order counts are modeled quantities and can be fractional. Displayed dollar amounts are rounded to cents; calculations use unrounded quantities. This guide uses completed orders / visits; it does not mix those visits with unique people. Rates above 100% are outside this simplified model.</p>
  <p class="small">Break-even holds acquisition spending, fixed costs, and per-order contribution constant. In real life, changing traffic or price can also change conversion, acquisition spending, and delivery costs. Tax, financing, owner pay, refunds, depreciation, and any unlisted expenses need separate treatment or explicit inclusion. This is not a profit forecast.</p></details>`;
}
function wireCalculator() {
  const form=$("#economics-form");
  if(!form)return;
  function draw(input) {
    const r=calculateEconomics(input);
    const rows=[
      ["Modeled orders",quantity(r.orders),`${quantity(input.visits)} visits x ${quantity(input.rate)}%`],
      ["Modeled net revenue",money(r.revenue),`${quantity(r.orders)} orders x ${money(input.price)}`],
      ["Variable delivery cost",money(r.variableCost),`${quantity(r.orders)} orders x ${money(input.variable)}`],
      ["Contribution",money(r.contribution),`${money(r.revenue)} - ${money(r.variableCost)}`],
      ["Acquisition + fixed costs",money(r.periodCost),`${money(input.acquisition)} + ${money(input.fixed)}`],
      [r.surplus<0?"Modeled shortfall before tax":"Modeled surplus before tax",money(r.surplus),`${money(r.contribution)} - ${money(r.periodCost)}`]
    ];
    $("#economics-results").innerHTML=`<dl class="calculation-rows">${rows.map(([name,value,formula])=>`<div><dt>${name}<small>${formula}</small></dt><dd>${value}</dd></div>`).join("")}</dl>
    <p class="break-even">${r.breakEvenOrders===null?"No positive per-order contribution: more of these orders cannot cover a positive acquisition/fixed-cost budget.":`Modeled cost-covering volume: ${quantity(r.breakEvenOrders)} whole orders at ${money(r.contributionPerOrder)} contribution per order.`}</p>`;
    $("#economics-error").hidden=true;$("#economics-results").hidden=false;
  }
  function update() {
    try {
      const data=new FormData(form),input={};
      for(const field of economicsFields) {
        const raw=data.get(field.id);
        if(typeof raw!=="string"||raw.trim()==="")throw new RangeError(`Enter ${field.label.toLowerCase()}.`);
        input[field.id]=Number(raw);
      }
      draw(input);
    } catch(error) {
      if(!(error instanceof RangeError))throw error;
      $("#economics-results").hidden=true;$("#economics-error").textContent=error.message;$("#economics-error").hidden=false;
    }
  }
  form.addEventListener("submit",event=>{event.preventDefault();update();});
  form.addEventListener("input",()=>{$("#economics-results").hidden=true;$("#economics-error").textContent="Inputs changed. Calculate again to see a matching result.";$("#economics-error").hidden=false;});
  $("#reset-example").addEventListener("click",()=>{form.reset();draw(exampleInputs);});
  draw(exampleInputs);
}

function preparePrint() {
  $("#print-course").innerHTML=`<h1>${esc(course.title)}</h1><p>${esc(course.printIntro)}</p><p>${esc(course.caseContext)} Course completion is not business validation.</p>`+
  lessons.map(l=>`<article><h2>${esc(learningGoals[l.id].label)}</h2><p>${esc(l.author)}: <a href="${esc(l.url)}">${esc(l.resource)}</a></p><p>${esc(l.origin)}.</p><h3>Learn</h3><p>${esc(l.idea)}</p>${l.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("")}<p>${esc(l.case)}</p><p>${esc(l.trap)}</p><h3>Check</h3><p>${esc(learningGoals[l.id].recall)}</p><p>${esc(state.recalls[l.id]||"(No recall note yet.)")}</p><p>${esc(l.quiz.question)}</p><ol>${l.quiz.options.map(o=>`<li>${esc(o)}</li>`).join("")}</ol><p>Answer: ${l.quiz.correct+1}. ${esc(l.quiz.explanations[l.quiz.correct])}</p><h3>Apply</h3><p>${esc(l.task)}</p><ol>${l.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p>${esc(l.prompt)}</p><p>${esc(state.notes[l.id]||"(No project note yet.)")}</p></article>`).join("");
}
function renderNotebook() {
  pageTitle("Your notebook");
  $("#view-content").innerHTML=`<section class="page notebook-page"><a class="back-link" href="#course">Back to the course</a><h1 id="notebook-title" tabindex="-1">Your founder notebook.</h1><p class="page-lead">Review the decisions you will take back to your project. Open a lesson below to edit its note.</p>
    <div class="notebook-tools"><button class="primary" id="export-notes" type="button">Export my notes</button><button class="text-button" id="print-guide" type="button">Print the full guide</button></div>
    <p class="small">These notes stay in this browser. Export before moving devices or clearing site data. Avoid private customer details.</p>
    <div class="notebook-entries">${lessons.map((l,i)=>`<details class="notebook-entry"><summary><span>${i+1}. ${esc(learningGoals[l.id].label)}</span><span class="entry-status">${state.completed.includes(l.id)?"Complete":state.notes[l.id]?.trim()?"Draft":"No note yet"}</span></summary><div class="editor"><label for="note-${l.id}">${esc(l.prompt)}</label><textarea id="note-${l.id}" data-note="${l.id}">${esc(state.notes[l.id]||"")}</textarea><span class="save-state">${storageAvailable&&!storageCorrupt?"Saved locally as you write.":"Not saved to storage. Export before leaving."}</span></div>${state.recalls[l.id]?.trim()?`<details class="recall-review"><summary>Your recall note</summary><p>${esc(state.recalls[l.id])}</p></details>`:""}<a class="entry-lesson" href="${lessonHref(l.id,"apply")}">Return to this practice</a></details>`).join("")}</div>
    <details class="storage-tools"><summary>Storage and reset</summary><p class="small">Reset removes only this course's notes and progress from this browser. Downloaded copies are unchanged.</p>${storageCorrupt?'<button class="secondary" id="export-original" type="button">Export original saved data</button>':""}<button class="secondary" id="reset-request" type="button" aria-expanded="false">Reset this course</button><div id="reset-confirm" hidden><p>Export first if you need a copy.</p><button class="secondary" id="reset-cancel" type="button">Keep my notes</button><button class="secondary" id="reset-yes" type="button">Delete my course notes</button></div></details></section>`;
  if(storageCorrupt)$(".storage-tools").open=true;
  $("#export-notes").addEventListener("click",()=>{save();download(`${course.exportName}-notes.md`,makeNotebook(lessons,state,course));announce("Notes exported.");});
  $("#print-guide").addEventListener("click",()=>{preparePrint();window.print();});
  if(storageCorrupt)$("#export-original").addEventListener("click",()=>{
    try{const raw=localStorage.getItem(storageKey);if(raw===null)throw new Error("The original record is no longer present.");download(`${course.exportName}-original.txt`,raw,"text/plain;charset=utf-8");}
    catch(error){storageError("The original data could not be exported. Your current in-tab notes can still be exported separately.");console.error("Original note export failed:",error);}
  });
  $("#reset-request").addEventListener("click",()=>{$("#reset-confirm").hidden=false;$("#reset-request").setAttribute("aria-expanded","true");$("#reset-cancel").focus();});
  $("#reset-cancel").addEventListener("click",()=>{$("#reset-confirm").hidden=true;$("#reset-request").setAttribute("aria-expanded","false");$("#reset-request").focus();});
  $("#reset-yes").addEventListener("click",()=>{
    clearTimeout(saveTimer);
    try{localStorage.removeItem(storageKey);}catch(error){storageError("Reset failed because browser storage is blocked. The notes in this tab have not been cleared.");console.error("Reset failed:",error);return;}
    const theme=state.theme;state=emptyProgress();state.theme=theme;storageAvailable=true;storageCorrupt=false;
    $("#storage-error").hidden=true;save();renderNotebook();$("#notebook-title").focus({preventScroll:true});announce("Course notes and progress reset.");
  });
  for(const entry of document.querySelectorAll(".notebook-entry"))entry.addEventListener("toggle",()=>{if(entry.open)for(const other of document.querySelectorAll(".notebook-entry"))if(other!==entry)other.open=false;});
  wireEditors();
}
function renderSources() {
  pageTitle("Reading list");
  $("#view-content").innerHTML=`<section class="reader sources-page"><a class="back-link" href="#course">Back to the course</a><h1 tabindex="-1">${esc(course.sourceHeading)}</h1><p class="page-lead">${esc(course.sourceIntro)}</p>
    <section class="source-boundary"><h2>What came from the reel?</h2><a class="small" href="${esc(course.reelUrl)}" rel="noopener noreferrer">View the original reel</a>${course.sourceParagraphs.map(p=>`<p>${esc(p)}</p>`).join("")}</section>
    <ol class="reading-list">${lessons.map(l=>`<li><a href="${esc(l.url)}" rel="noopener noreferrer">${esc(l.resource)}</a><span>${esc(l.author)}</span><p>${esc(l.origin)}.</p></li>`).join("")}</ol>${course.calculator?'<p class="small">Additional definition check: <a href="https://stripe.com/resources/more/cac-in-saas" rel="noopener noreferrer">Stripe on customer acquisition cost</a>. The example separates new customers from orders and treats timing and attribution as conditions, not guarantees.</p>':""}<p class="small">Public titles and source pages checked on ${esc(course.checkedDate)}. Advice is context-dependent.</p>${course.lab?'<a class="secondary" href="#lab">Try optional evidence practice</a>':""}</section>`;
}
function renderLab() {
  pageTitle("Evidence practice");
  const final=labIndex>=signals.length;
  $(".evidence-figure").hidden=final;
  $("#lab-questions").innerHTML=`<p class="eyebrow">Optional practice</p><h1 id="lab-title" tabindex="-1">What does this signal prove?</h1><p class="page-lead">An opinion, an observed behavior, and a commitment answer different questions. Sort the statement, then inspect the limit.</p>
    ${final?`<p class="lab-statement">You classified ${labCorrect} of ${signals.length} correctly on the first try.</p><p>This is practice with evidence categories, not a startup score.</p><button id="restart-lab" class="primary" type="button">Try again</button>`:
    `<p class="small">Statement ${labIndex+1} of ${signals.length}</p><p class="lab-statement">${esc(signals[labIndex].text)}</p><form id="lab-form"><fieldset><legend>Which category fits?</legend>${categories.map(c=>`<label class="answer"><input type="radio" name="category" value="${c}" required><span>${c[0].toUpperCase()+c.slice(1)}</span></label>`).join("")}</fieldset><button id="check-signal" class="primary" type="submit">Check my classification</button><div id="lab-feedback" class="feedback" role="status" hidden></div><button id="next-signal" class="primary" type="button" hidden>${labIndex===signals.length-1?"Review the practice":"Next statement"}</button></form><p class="small">Opinion: a reaction or prediction. Behavior: something that happened. Commitment: a specific investment of time, effort, or money.</p>`}`;
  if(final){$("#restart-lab").addEventListener("click",()=>{labIndex=0;labCorrect=0;renderLab();setDrawer(null);});return;}
  labChecked=false;
  $("#lab-form").addEventListener("submit",event=>{
    event.preventDefault();if(labChecked)return;
    const result=evaluateSignal(signals[labIndex],new FormData(event.currentTarget).get("category"));
    if(result.correct)labCorrect++;labChecked=true;
    const feedback=$("#lab-feedback");feedback.hidden=false;feedback.dataset.result=result.correct?"correct":"incorrect";
    feedback.innerHTML=`<p><strong>${result.correct?"That fits.":`This is ${esc(result.category)}.`}</strong> ${esc(result.explanation)}</p><p>Next: ${esc(result.next)}</p>`;
    setDrawer(result.category,result.explanation);
    $("#check-signal").hidden=true;for(const input of document.querySelectorAll("#lab-form input"))input.disabled=true;
    $("#next-signal").hidden=false;
  });
  $("#next-signal").addEventListener("click",()=>{labIndex++;renderLab();setDrawer(null);$("#lab-title").focus({preventScroll:true});});
}
function renderRoute({focus=false}={}) {
  save();clearLessonVisual();
  activeRoute=parseLearningRoute(location.hash,ids);
  if(activeRoute.view==="lab"&&!course.lab)activeRoute={view:"not-found"};
  const lab=activeRoute.view==="lab";$("#view-content").hidden=lab;$("#lab-section").hidden=!lab;
  if(activeRoute.view==="course")renderCourse();
  else if(activeRoute.view==="lesson")renderLesson(byId(activeRoute.id),activeRoute.phase);
  else if(activeRoute.view==="notebook")renderNotebook();
  else if(activeRoute.view==="sources")renderSources();
  else if(lab)renderLab();
  else {pageTitle("Page not found");$("#view-content").innerHTML='<section class="reader"><h1 tabindex="-1">That lesson was not found.</h1><p>The link may be incomplete or out of date.</p><a class="primary" href="#course">Open the course</a></section>';}
  for(const link of document.querySelectorAll("[data-nav]")) {
    const current=link.dataset.nav==="course"?["course","lesson"].includes(activeRoute.view):activeRoute.view==="notebook";
    if(current)link.setAttribute("aria-current","page");else link.removeAttribute("aria-current");
  }
  if(focus){window.scrollTo({top:0,behavior:"instant"});const heading=$(lab?"#lab-title":"#view-content h1");if(heading)heading.focus({preventScroll:true});}
}
window.addEventListener("hashchange",()=>renderRoute({focus:true}));
window.addEventListener("pagehide",save);window.addEventListener("beforeprint",preparePrint);

const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
const parts=[...document.querySelectorAll("#cabinet-parts>[data-part]")];
const opening=Object.fromEntries(categories.map(c=>[c,0]));
let selectedDrawer=null,visible=false,frame=0,last=0;
function paintCabinet() {
  for(const part of parts){const share=opening[part.dataset.drawer]||0;part.setAttribute("transform",`translate(${cabinetMotion[0]*share} ${cabinetMotion[1]*share})`);part.classList.toggle("selected",part.dataset.drawer===selectedDrawer);}
  const sorted=[...parts].sort((a,b)=>(Number(a.dataset.key)+Number(a.dataset.lift)*(opening[a.dataset.drawer]||0))-(Number(b.dataset.key)+Number(b.dataset.lift)*(opening[b.dataset.drawer]||0)));
  for(const part of sorted)$("#cabinet-parts").append(part);
}
function tick(now) {
  const dt=last?Math.min((now-last)/1000,1/30):1/60;last=now;let moving=false;
  for(const category of categories){const target=category===selectedDrawer?1:0;opening[category]=reduceMotion.matches?target:opening[category]+(target-opening[category])*(1-Math.exp(-dt/.16));if(Math.abs(target-opening[category])<.001)opening[category]=target;else moving=true;}
  paintCabinet();frame=visible&&moving?requestAnimationFrame(tick):0;
}
function wakeCabinet(){if(reduceMotion.matches){for(const c of categories)opening[c]=c===selectedDrawer?1:0;paintCabinet();return;}if(visible&&!frame){last=0;frame=requestAnimationFrame(tick);}}
function setDrawer(category,explanation="Check your classification to open the matching drawer.") {
  if(category!==null&&!categories.includes(category))throw new RangeError("Unknown evidence category.");
  selectedDrawer=category;$("#signal-reading").textContent=explanation;wakeCabinet();
}
if(course.lab)new IntersectionObserver(entries=>{visible=entries[entries.length-1].isIntersecting;if(!visible&&frame){cancelAnimationFrame(frame);frame=0;}else if(visible)wakeCabinet();},{rootMargin:"120px 0px"}).observe($(".cabinet-stage"));
reduceMotion.addEventListener("change",wakeCabinet);
renderRoute();
</script>
