  <script>

  <style>:root {

  --cp-accent: #fd8ea1; --cp-accent-hover: #fb7b91; --cp-accent-soft: rgba(253, 142, 161, 0.14); --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80; --cp-danger: #f87171; --cp-warning: #fbbf24; --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32); --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72); --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04); --cp-highlight: rgba(253, 142, 161, 0.12);
}
html[data-palette="signature"] {
  --cp-bg: #fafafa; --cp-bg-elevated: #f0f0eb; --cp-surface: #ffffff; --cp-surface-soft: #eaeae4;
  --cp-border: #d6d6cf; --cp-border-strong: #7c7d76; --cp-text: #1c1d20; --cp-text-muted: #595b56; --cp-text-soft: #61635c;
  --cp-accent: #ca8a04; --cp-accent-hover: #a66d00; --cp-accent-fg: #1c1d20; --cp-accent-soft: #fff5ca; --cp-highlight: #f7e7a0;
  --cp-success: #13794d; --cp-danger: #b83131; --cp-warning: #ad4d18; --cp-link: #695214;
  --cp-glass: rgba(250,249,245,.9);

  --cp-figure-paper: #e3e3da; --cp-figure-top: #fafaf5; --cp-shade-0: #b6b7af; --cp-shade-1: #c4c5bb; --cp-shade-2: #d2d3c8; --cp-shade-3: #ddded3;
  --cp-lit: #282a28; --cp-figure-edge: #96998c; --cp-figure-mid: #777b6b; --cp-figure-low: #a7aa9c;
}
html[data-palette="signature"][data-theme="dark"] {

  --cp-border: #404145; --cp-border-strong: #73756f; --cp-text: #f2f1e9; --cp-text-muted: #babbb0; --cp-text-soft: #a2a597;
  --cp-accent: #ffd84d; --cp-accent-hover: #ffe378; --cp-accent-fg: #1c1d20; --cp-accent-soft: #393626; --cp-highlight: #4a4228;
  --cp-success: #5dd39e; --cp-danger: #ff8585; --cp-warning: #f59b68; --cp-link: #e5cc79;
  --cp-glass: rgba(28,29,32,.9);
  --cp-dome: 0 0 6px rgba(0,0,0,.15),0 2px 10px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08),inset 2.5px 2.5px .5px -2px rgba(255,255,255,.12),inset -2.5px -2.5px .5px -2px rgba(255,255,255,.06),inset 1px 1px 1px -.5px rgba(255,255,255,.08),inset -1px -1px 1px -.5px rgba(255,255,255,.04),inset 0 0 8px 4px rgba(255,255,255,.02),0 0 14px rgba(255,255,255,.03);

*{box-sizing:border-box}
html{scroll-padding-top:88px}
body{margin:0;background:var(--cp-bg);color:var(--cp-text);font:18px/1.75 "Segoe UI",Aptos,Calibri,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:4px}
button,a,summary{touch-action:manipulation}
button,summary{cursor:pointer}
button{min-height:44px}
button:disabled{opacity:.5;cursor:not-allowed}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cp-accent);outline-offset:5px}
::selection{background:var(--cp-highlight);color:var(--cp-text)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:620;line-height:1.2;text-wrap:balance}
h1{font-size:42px;letter-spacing:-1.65px}
h2{font-size:23px;letter-spacing:-.5px}
h3{font-size:18px}
p+p{margin-top:18px}
.page{width:min(calc(100% - 48px),880px);margin:0 auto}
.reader{width:min(calc(100% - 48px),68ch);max-width:700px;margin:0 auto;padding:36px 0 72px}
#main-content{min-height:70vh}
#main-content:focus,h1:focus{outline:none}
.lg-svg{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.topbar{position:sticky;top:0;z-index:10;background:var(--cp-glass);backdrop-filter:blur(2px) url("#liquid-distort") saturate(150%);-webkit-backdrop-filter:blur(2px) url("#liquid-distort") saturate(150%);box-shadow:var(--cp-dome);border:none}
.topbar-inner{max-width:1040px;height:64px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font-size:17px;font-weight:650;letter-spacing:-.5px;white-space:nowrap}
.brand svg{color:var(--cp-accent)}
.topbar nav{display:flex;gap:22px;margin-left:auto}
.topbar nav a{font-size:14px;color:var(--cp-text-muted);min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.topbar nav a[aria-current="page"]{color:var(--cp-text);text-decoration:underline;text-decoration-color:var(--cp-accent);text-decoration-thickness:2px;text-underline-offset:7px}
.icon-button{width:44px;flex:0 0 44px;display:grid;place-items:center;background:none;border:none;border-radius:8px}
.icon-button:hover{background:var(--cp-surface-soft)}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 20px;border:0;border-radius:8px;font-size:15px;font-weight:650;line-height:1.5;text-decoration:none}
.primary{background:var(--cp-accent);color:var(--cp-accent-fg)}
.primary:hover:not(:disabled){background:var(--cp-accent-hover)}
.secondary{background:none;color:var(--cp-text);border:1px solid var(--cp-border-strong);font-weight:550}
.secondary:hover{background:var(--cp-surface-soft)}
.text-button{border:0;background:none;padding:10px 0;text-decoration:underline;text-underline-offset:4px;font-size:14px}
.small{font-size:13px;line-height:1.65;color:var(--cp-text-muted)}
.eyebrow{font-size:13px;color:var(--cp-text-muted);margin-bottom:14px}
.back-link{display:inline-flex;align-items:center;min-height:44px;font-size:13px;color:var(--cp-text-muted);margin-bottom:10px;text-decoration:none}
.back-link::before{content:"\2190";margin-right:9px}
.back-link:hover{text-decoration:underline}
.course-page{padding:48px 0 64px}
.course-intro{max-width:650px;padding-bottom:42px}
.course-intro h1{font-size:50px;max-width:18ch;line-height:1.08;letter-spacing:-2px}
.course-lead{font-size:20px;line-height:1.6;max-width:47ch;margin:22px 0 24px}
.course-guidance{font-size:14px;color:var(--cp-text-muted);max-width:57ch;margin-top:16px}
.course-progress{font-size:13px;color:var(--cp-text-muted);margin-top:12px}
.chapter{display:grid;grid-template-columns:1fr 1.1fr;gap:36px;padding:28px 0;border-top:1px solid var(--cp-border)}
.chapter-heading{display:flex;align-items:flex-start;gap:16px}
.chapter-number{font-size:13px;color:var(--cp-text-soft);line-height:28px;min-width:18px}
.chapter h2{font-size:23px;margin-bottom:9px}
.chapter-heading p{font-size:14px;line-height:1.65;color:var(--cp-text-muted);max-width:28ch}
.lesson-menu{list-style:none;padding:0;margin:0;counter-reset:none}
.lesson-menu li+li{border-top:1px solid var(--cp-border)}
.lesson-menu a{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:52px;font-size:15px;text-decoration:none;padding:10px 0}
.lesson-menu a:hover{color:var(--cp-accent)}
.lesson-menu-end{flex-shrink:0;color:var(--cp-text-muted)}
.completion-label{font-size:11px;color:var(--cp-success)}
.course-boundary{border-top:1px solid var(--cp-border);padding-top:24px;margin-top:8px;font-size:12px;line-height:1.7;color:var(--cp-text-muted)}
.lesson-location{font-size:12px;color:var(--cp-text-muted);margin:0 0 10px}
.lesson-location span{margin-inline:8px;color:var(--cp-text-soft)}
.lesson-header h1{font-size:38px;max-width:26ch}
.lesson-outcome{font-size:14px;color:var(--cp-text-muted);margin-top:14px}
.phase-nav{display:flex;gap:32px;border-bottom:1px solid var(--cp-border);margin:26px 0 28px}
.phase-nav a{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 0 12px;font-size:14px;color:var(--cp-text-muted);text-decoration:none;border-bottom:2px solid transparent}
.phase-nav a span{font-size:10px;border:1px solid var(--cp-border-strong);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;line-height:1}
.phase-nav a[aria-current="step"]{color:var(--cp-text);border-bottom-color:var(--cp-accent)}
.phase-nav a[aria-current="step"] span{border-color:var(--cp-accent);background:var(--cp-accent-soft);color:var(--cp-accent)}
.lesson-idea{font-size:22px;line-height:1.6;letter-spacing:-.3px;margin-bottom:22px}
.core-explanation{color:var(--cp-text-muted);font-size:17px;line-height:1.8}
.worked-example{margin:30px 0;padding:24px;background:var(--cp-bg-elevated);border-radius:8px}
.worked-example h2{font-size:17px;margin-bottom:15px;letter-spacing:-.2px}
.worked-example p{font-size:16px;line-height:1.8}
.worked-example .case-context{font-size:14px;color:var(--cp-text-muted);margin-bottom:16px}
.example-contrast{margin:22px 0 0;font-size:16px}
.example-contrast div+div{margin-top:18px;padding-top:18px;border-top:1px solid var(--cp-border)}
.example-contrast dt{font-size:12px;color:var(--cp-text-muted);margin-bottom:5px}
.example-contrast dd{margin:0;line-height:1.7}
.lesson-caution{font-size:14px;color:var(--cp-text-muted);line-height:1.75}
.lesson-caution strong{color:var(--cp-text);font-weight:600}
details summary{min-height:44px;padding:11px 0;font-size:14px;line-height:1.6}
details p{font-size:16px;line-height:1.8;color:var(--cp-text-muted);margin:12px 0}
.deeper{margin-top:18px}
.phase-forward{margin-top:30px}
.phase-forward .small{margin-top:12px}
.lesson-source{font-size:12px;line-height:1.75;color:var(--cp-text-soft);margin-top:28px;padding-top:18px;border-top:1px solid var(--cp-border)}
.lesson-phase>h2{font-size:25px;line-height:1.3;margin:0 0 14px}
.lesson-phase>h2+p{color:var(--cp-text-muted);font-size:16px}
.editor{margin-top:26px}
.editor label{display:block;font-size:17px;line-height:1.65;font-weight:550;margin-bottom:12px}
textarea{display:block;width:100%;min-height:180px;resize:vertical;padding:16px;font-size:16px;line-height:1.75;border:1px solid var(--cp-border-strong);border-radius:8px;background:var(--cp-bg);color:var(--cp-text)}
textarea::placeholder{color:var(--cp-text-soft);opacity:1}
#recall-note{min-height:128px}
.save-state{display:block;font-size:12px;color:var(--cp-text-muted);margin-top:9px}
.choices{margin-top:28px}
.choices>summary{display:inline-flex;align-items:center;min-height:48px;padding:11px 20px;background:var(--cp-accent);color:var(--cp-accent-fg);border-radius:8px;font-size:15px;font-weight:650;list-style:none}
.choices>summary::-webkit-details-marker{display:none}
.choices[open]>summary{background:none;color:var(--cp-text-muted);padding:10px 0;font-size:13px;font-weight:400;text-decoration:underline}
fieldset{padding:0;margin:20px 0;border:0;min-width:0}
legend{padding:0;margin-bottom:18px;font-size:19px;line-height:1.6;font-weight:550}
.answer{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--cp-border);border-radius:8px;margin:10px 0;cursor:pointer;font-size:16px;line-height:1.7;min-height:48px}
.answer input{margin:6px 0 0;width:17px;height:17px;accent-color:var(--cp-accent);flex-shrink:0}
.answer:has(input:checked){background:var(--cp-accent-soft);border-color:var(--cp-accent)}
.feedback{padding:18px 0;font-size:16px;line-height:1.75}
.feedback[data-result="incorrect"]{color:var(--cp-warning)}
.check-passed{font-size:14px;color:var(--cp-text-muted);margin:22px 0 14px}
.quiet-back{display:block;font-size:13px;color:var(--cp-text-muted);margin-top:24px;min-height:44px;padding:10px 0}
.guidance{margin-top:22px}
.guidance ol{padding-left:22px;font-size:16px;line-height:1.8;color:var(--cp-text-muted)}
.guidance li+li{margin-top:8px}
.guidance h3{margin-top:20px;font-size:15px}
.lesson-done{padding-top:40px}
.lesson-done h1{margin-bottom:30px}
.lesson-done h2{font-size:16px;margin-bottom:12px}
.saved-decision{font-size:21px;line-height:1.7;white-space:pre-line;border-left:2px solid var(--cp-accent);padding-left:22px;margin-bottom:20px}
.notebook-page,.lab-page{padding:36px 0 64px}
.page-lead{font-size:18px;color:var(--cp-text-muted);max-width:62ch;line-height:1.7;margin-top:18px}
.notebook-tools{display:flex;align-items:center;flex-wrap:wrap;gap:24px;margin:26px 0 18px}
.notebook-entries{margin-top:32px}
.notebook-entry{border-top:1px solid var(--cp-border)}
.notebook-entry:last-child{border-bottom:1px solid var(--cp-border)}
.notebook-entry>summary{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:17px 0;font-size:16px;list-style:none}
.entry-status{font-size:12px;color:var(--cp-text-muted);white-space:nowrap}
.notebook-entry[open]{padding-bottom:24px}
.notebook-entry[open]>summary{font-weight:600}
.notebook-entry .editor{margin-top:10px}
.entry-lesson{display:inline-block;min-height:44px;padding:10px 0;font-size:13px;color:var(--cp-text-muted)}
.recall-review p{white-space:pre-line}
.storage-tools{margin-top:32px}
.storage-tools button{margin:12px 12px 0 0}
.sources-page h1{margin-bottom:18px}
.source-boundary{margin:32px 0}
.source-boundary h2{font-size:21px;margin-bottom:16px}
.source-boundary p{font-size:16px;line-height:1.8;color:var(--cp-text-muted)}
.reading-list{padding-left:22px}
.reading-list li{padding:18px 0 18px 6px;border-top:1px solid var(--cp-border)}
.reading-list li>a{font-size:17px;font-weight:550}
.reading-list span{display:block;font-size:14px;color:var(--cp-text-muted);margin-top:5px}
.reading-list li p{font-size:12px;line-height:1.7;color:var(--cp-text-soft);margin-top:5px}
.sources-page>.secondary{margin-top:24px}
.storage-error{width:min(calc(100% - 48px),880px);margin:22px auto;padding:16px;border:1px solid var(--cp-warning);font-size:14px;line-height:1.7}
.footer{display:flex;gap:20px;flex-wrap:wrap;padding:24px 0 32px;border-top:1px solid var(--cp-border);font-size:12px;color:var(--cp-text-muted)}
.footer>span{margin-right:auto}
.footer>a{min-height:44px;display:flex;align-items:center}
.footer>span{display:flex;align-items:center;min-height:44px}
.learning-visual{margin-top:22px}
.example-switch{display:flex;border-bottom:1px solid var(--cp-border);gap:20px;margin-bottom:18px}
.example-switch button{background:none;border:0;border-bottom:2px solid transparent;color:var(--cp-text-muted);padding:8px 0;min-height:48px;font-size:14px;line-height:1.5;text-align:left}
.example-switch button[aria-pressed="true"]{color:var(--cp-text);border-bottom-color:var(--cp-accent)}
.question-example>span,.question-result>span{font-size:12px;color:var(--cp-text-muted)}
.question-example p{font-size:21px;line-height:1.55;margin:6px 0 18px;letter-spacing:-.4px}
.question-result{border-left:2px solid var(--cp-border-strong);padding-left:16px}
.question-result p{font-size:16px;line-height:1.75;margin:6px 0 0}
.worked-example .visual-hint{font-size:12px;color:var(--cp-text-soft);margin:18px 0 0}
.scope-drawing{width:100%;height:auto}
.scope-line{stroke:var(--cp-accent);stroke-width:1.6;fill:none}
.scope-core rect{fill:var(--cp-surface);stroke:var(--cp-border-strong);stroke-width:1}
.scope-core text{fill:var(--cp-text);font-size:14px}
.scope-extra{opacity:.14}
.expanded .scope-extra{opacity:1}
.scope-extra path{fill:none;stroke:var(--cp-border-strong);stroke-width:1;stroke-dasharray:3 4}
.scope-extra rect{fill:var(--cp-bg);stroke:var(--cp-border);stroke-width:1}
.scope-extra text{fill:var(--cp-text-muted);font-size:13px}
.scope-key{display:none}
.worked-example .scope-explanation,.worked-example .scope-extras{font-size:14px;color:var(--cp-text-muted);line-height:1.75}
.visual-error{font-size:14px;padding:16px;border:1px solid var(--cp-warning)}
.lab-page{max-width:720px}
.lab-statement{font-size:24px;line-height:1.5;margin:22px 0}
#lab-questions>.small{margin-top:24px}
#lab-form>.small{margin-top:24px}
#lab-form>#next-signal{margin:12px 0 24px}
.evidence-figure{max-width:540px;margin:32px auto 0;border:1px solid var(--cp-border);border-radius:10px;background:var(--cp-bg-elevated);overflow:hidden}
.figure-heading{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;font-size:11px;color:var(--cp-text-muted)}
.figure-heading h2{font-size:13px;letter-spacing:0;font-weight:550}
.cabinet-stage{height:300px;padding:0 14px;overflow:hidden}
.cabinet-svg{width:100%;height:100%;overflow:visible}
.iso-fill{fill:var(--cp-figure-paper);stroke:none}
.iso-top{fill:var(--cp-figure-top);stroke:none}
.iso-shade{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--cp-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--cp-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--cp-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--cp-shade-3)}
.iso-line{fill:none;stroke:var(--cp-figure-low);stroke-width:.6px;stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--cp-figure-edge)}
.iso-line[data-tone="mid"]{stroke:var(--cp-figure-mid)}
.iso-line[data-tone="lo"],.iso-line[data-tone="faint"]{stroke:var(--cp-figure-low)}
.iso-dots circle{fill:var(--cp-figure-edge)}
.iso-face-text{fill:var(--cp-figure-mid);font-family:inherit;letter-spacing:.5px}
.selected .iso-solid[data-lit]>.iso-top,.selected .iso-solid[data-lit]>.iso-shade{fill:var(--cp-accent)}
.selected .iso-solid[data-lit]>.iso-edge,[data-drawer].selected .iso-edge{stroke:var(--cp-lit)}
figcaption{padding:10px 20px 20px}
#signal-reading{font-size:14px;line-height:1.7}
figcaption .small{font-size:11px;line-height:1.7;margin-top:12px}
.skip-link{position:fixed;top:-100px;left:20px;z-index:30;padding:10px 16px;background:var(--cp-accent);color:var(--cp-accent-fg)}
.skip-link:focus{top:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#print-course{display:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.topbar{background:var(--cp-bg);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media(max-width:640px){
  body{font-size:17px}
  .topbar-inner{padding-inline:16px;gap:12px}
  .brand-full{display:none}
  .brand{font-size:16px;gap:8px}
  .topbar nav{gap:16px}
  .topbar nav a{font-size:13px}
  .page{width:calc(100% - 40px)}
  .reader{width:calc(100% - 40px);padding-top:24px}
  .course-page{padding-top:32px}
  .course-intro{padding-bottom:30px}
  .course-intro h1{font-size:37px;letter-spacing:-1.4px;max-width:17ch}
  .course-lead{font-size:18px;margin-top:18px}
  .course-guidance{font-size:13px}
  .chapter{display:block;padding:24px 0}
  .chapter-heading{gap:12px;margin-bottom:12px}
  .chapter h2{font-size:22px}
  .chapter-heading p{max-width:none;font-size:14px}
  .lesson-menu{padding-left:30px}
  .lesson-menu a{font-size:15px;min-height:52px}
  .lesson-header h1{font-size:31px;line-height:1.15;letter-spacing:-1px}
  .lesson-location{font-size:11px}
  .lesson-outcome{font-size:13px}
  .phase-nav{gap:28px;margin:22px 0}
  .phase-nav a{font-size:14px}
  .lesson-idea{font-size:21px;line-height:1.6}
  .core-explanation{font-size:17px}
  .worked-example{padding:20px;margin:26px 0}
  .worked-example p,.example-contrast{font-size:16px}
  .lesson-phase>h2{font-size:23px}
  .primary,.secondary{max-width:100%;font-size:14px;padding:12px 18px;min-height:48px}
  .editor label{font-size:17px}
  textarea{padding:14px;min-height:180px}
  .notebook-page h1,.sources-page h1,.lab-page h1,.lesson-done h1{font-size:32px;letter-spacing:-1px}
  .page-lead{font-size:17px}
  .notebook-tools{gap:14px}
  .notebook-entry>summary{font-size:15px;gap:12px}
  .entry-status{font-size:11px}
  .example-switch{gap:16px}
  .example-switch button{font-size:13px;flex:1}
  .scope-core text,.scope-extra text{display:none}
  .scope-key{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;list-style:none;padding:0;margin:0 0 18px;font-size:12px;line-height:1.5;text-align:center;color:var(--cp-text-muted)}
  .footer{gap:10px 20px}
  .footer>span{flex-basis:100%;min-height:20px}
  .cabinet-stage{height:270px}
  .figure-heading{gap:12px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  :root,html[data-theme],html[data-palette="signature"],html[data-palette="signature"][data-theme="dark"]{--cp-bg:#ffffff;--cp-text:#000000;--cp-text-muted:#333333;--cp-border:#bbbbbb;color-scheme:light}
  .topbar,main,.footer,.storage-error,.skip-link{display:none!important}
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
  #print-course{display:block;font-size:11pt}
  #print-course h1{font-size:28pt;margin-bottom:20px}
  #print-course h2{font-size:20pt;margin:28px 0 16px}
  #print-course h3{margin:18px 0 10px}
  #print-course article{break-before:page}
  #print-course a{overflow-wrap:anywhere}
  #print-course p{margin-bottom:12px;white-space:pre-line}
  @page{margin:18mm}
}
</style>

  <script>const lessons=[{"id":"problem","group":"Find the problem","short":"Notice expensive friction","title":"Start with a problem someone already has.","author":"Paul Graham","resource":"How to Get Startup Ideas","url":"https://paulgraham.com/startupideas.html","origin":"Selected from an author named in the reel","idea":"Start with a person who repeatedly struggles with a task. Look for the workaround they already use.","paragraphs":["A real problem leaves a trace: time spent, money paid, a delay, or a workaround. Find people you can reach and ask to see that trace. A problem you have yourself is a useful lead. Other people's behavior is what you still need to investigate.","Look for a specific person, a recurring situation, and a costly workaround. Cost can mean time, money, delay, or risk. Someone spending effort to solve a problem tells you more than someone agreeing that the idea sounds useful."],"case":"Our fictional founder wants to build an AI assistant for everyone who handles money. A narrower observation is more useful: independent bookkeepers chase missing client receipts before each monthly close. Now there is a workflow to investigate and a person to find.","distinction":["Weak starting point","An AI tool for small businesses.","Testable starting point","Independent bookkeepers repeatedly chase missing receipts before closing a client's books."],"task":"Write a problem statement without naming your product.","steps":["Choose a person you can realistically reach.","Describe the last situation in which the problem occurred.","Record the workaround and the cost. Mark guesses as guesses."],"prompt":"Who struggles, in what situation, and what do they do about it today?","example":"Independent bookkeepers lose time chasing missing receipts before monthly close. I still need to check how often this happens and which part is most painful.","trap":"A narrow first customer is a learning choice, not a claim that the whole market is small. Do not turn your own experience into a market-size estimate.","quiz":{"question":"Which observation gives you the best starting point?","options":["The market has millions of small businesses.","A bookkeeper shows the reminder spreadsheet they use every close.","Your friends think your app name is memorable."],"correct":1,"explanations":["A large category says little about urgency or access to customers.","A specific workaround exposes a real workflow. You still need to check frequency and cost.","A reaction to branding is not evidence of a costly customer problem."]},"takeaway":"Find a workaround before you build its replacement."},{"id":"interviews","group":"Find the problem","short":"Ask about the last time","title":"Get the story before you pitch the solution.","author":"Rob Fitzpatrick","resource":"The Mom Test","url":"https://www.momtestbook.com/","origin":"Book explicitly named in the reel","idea":"Ask what the customer has already done. A recent real event tells you more than a prediction about your app.","paragraphs":["When you describe your solution first, a person may react to the pitch instead of explaining their problem. Ask them to walk through a recent situation. Follow what they tried, where it failed, and what it cost. Ask permission before viewing client information or keeping sensitive notes.","Ask for a recent example, then follow the sequence: what started the work, what they tried, who was involved, and what happened afterward. Keep observed facts separate from your interpretation. Ask permission before taking sensitive notes or viewing customer material."],"case":"Instead of asking whether an AI reminder bot sounds useful, ask the bookkeeper to describe their most recent close. You learn that reminder writing is quick, but finding which documents are still missing is slow. That changes what you should test.","distinction":["Leading question","Would you pay for my automatic receipt chaser?","Learning question","Walk me through how you handled missing receipts on your last close."],"task":"Rewrite your interview questions so they can uncover an inconvenient answer.","steps":["Remove the product name and the promised benefit.","Ask for one recent event and its actual sequence.","Ask what they tried and why it did or did not help."],"prompt":"Write three questions about past behavior. What answer would make you reconsider your idea?","example":"Walk me through your last close. How did you identify the missing items? What happened when a client did not respond? I would reconsider if the work was rare or already handled well.","trap":"Do not treat a friendly conversation as validation. Interest, access to a workflow, and an agreement to a pilot are different signals.","quiz":{"question":"A customer says, 'I'd definitely use that.' What should you do next?","options":["Count them as a future paying customer.","Ask them to repeat the compliment for your website.","Ask about the last time the problem happened and what they actually did."],"correct":2,"explanations":["A prediction of future use is not a purchase or observed use.","A testimonial cannot resolve whether the underlying problem matters.","A concrete past event can expose frequency, workarounds, and consequences."]},"takeaway":"Make it easy for the customer to disagree."},{"id":"learning","group":"Find the problem","short":"Choose the next uncertainty","title":"Keep the learning loop close to the customer.","author":"Y Combinator","resource":"YC's essential startup advice","url":"https://www.ycombinator.com/library/4D-yc-s-essential-startup-advice","origin":"Selected from an organization named in the reel","idea":"Test the assumption that could stop your plan from working before you build around it.","paragraphs":["An assumption is something your plan depends on but you have not checked. A customer might want the result while refusing the data access your service needs. Write down the uncertain condition. Choose a small, safe test that could show you are wrong.","Separate a belief about the problem from a belief about the solution. Someone may genuinely struggle with a workflow but refuse access to the data your product needs. Test that constraint before you automate the workflow."],"case":"The bookkeeper confirms that missing receipts are painful. But they will not connect a client's inbox to an unknown app. A safe test might use a redacted checklist or sample files. A better reminder model cannot fix a missing permission.","distinction":["Output","Build another inbox integration.","Learning outcome","Find out whether the customer can and will share the inputs the service needs."],"task":"Name the uncertainty that could make your current plan fail.","steps":["Write one assumption about the customer or workflow.","Describe an observation that would contradict it.","Choose the smallest safe way to obtain that observation."],"prompt":"What do you need to learn before more building makes sense?","example":"I assume bookkeepers can provide a redacted missing-document checklist. I will ask one to show how that checklist is created before building an importer.","trap":"A small early sample can guide a next step. It does not establish representative demand or prove that all customers behave the same way.","quiz":{"question":"Users want the outcome but cannot share the required data. What comes next?","options":["Test a permissible input or a different workflow.","Add more features until the product feels credible.","Declare demand validated and buy ads."],"correct":0,"explanations":["The input constraint can block the service. Investigate a safe alternative before investing further.","Feature count does not solve permission, trust, or data access.","Interest in an outcome does not establish that your delivery model can work."]},"takeaway":"Build to answer a question you can name."},{"id":"mvp","group":"Test the offer","short":"Cut to one useful outcome","title":"Make the smallest version useful to someone.","author":"Michael Seibel / Y Combinator","resource":"How to plan an MVP","url":"https://www.ycombinator.com/library/6f-how-to-plan-an-mvp","origin":"Selected from an organization named in the reel","idea":"Build the smallest complete way to help one kind of customer do one useful job.","paragraphs":["This first version is often called a minimum viable product, or MVP. Its job is to test an outcome with a real user. Cut features that do not help answer that question. Keep the permissions, reliability, and honesty needed to deliver the small outcome safely.","Minimum does not excuse unsafe handling, broken promises, or unusable work. Manual delivery can reduce technical scope, but the customer should understand what is manual and what the pilot does not do."],"case":"The first receipt-chasing service could accept a permitted checklist and return a clear missing-item summary. It does not need bank sync, forecasting, or a team dashboard. The useful test is whether the summary helps the bookkeeper complete the close.","distinction":["Feature bundle","Dashboard, AI chat, bank sync, forecasting, reminders.","First useful result","A checked list of missing items for one close, with a clear handoff."],"task":"Write a pilot scope that fits on a short note.","steps":["Name the input the customer can safely provide.","Define the output and the customer's next action.","List what you will deliberately leave out and what must still be reliable."],"prompt":"What is the smallest complete outcome, and what will you leave out?","example":"Input: a redacted receipt checklist. Output: a reviewed list of missing items. Leave out inbox access, automated sending, and bank sync. The customer reviews the output before using it.","trap":"A prototype that gets clicks can test comprehension. It cannot by itself prove that the service delivers value, retains users, or earns money.","quiz":{"question":"Which MVP scope answers the most useful question?","options":["A polished landing page with every planned feature.","One safe workflow that produces a result the target user can use.","An architecture that can support a hypothetical million customers."],"correct":1,"explanations":["A landing page can test a message, but not whether the proposed workflow works.","A complete, narrow outcome lets you observe usefulness while keeping scope small.","Early scale does not answer whether the first customer wants the result."]},"takeaway":"Cut features. Keep the customer's outcome."},{"id":"manual","group":"Test the offer","short":"Do the work by hand","title":"Learn the service before you automate it.","author":"Paul Graham","resource":"Do Things That Don't Scale","url":"https://paulgraham.com/ds.html","origin":"Selected from an author named in the reel","idea":"Deliver the result yourself before deciding which parts to automate.","paragraphs":["A manual pilot is a small service you perform by hand. Watching one complete job exposes exceptions, trust concerns, and the steps the customer values. Record the time and resources it takes. A useful service and a sustainable way to deliver it are separate things to test.","Manual service exposes exceptions, trust concerns, and the steps customers value. Record the time and resources it takes. A delighted customer is useful evidence, but a service that requires unsustainable effort still needs a better delivery model."],"case":"You sit with a bookkeeper, prepare the missing-item summary, and watch them use it. They ignore your carefully written reminder and use only the client-by-client checklist. Automating the reminder first would have accelerated the wrong part.","distinction":["Premature automation","Build a workflow engine before watching one complete job.","Useful manual work","Deliver one outcome, observe the handoff, and record the recurring steps."],"task":"Design a small concierge pilot you can deliver honestly.","steps":["Recruit a specific person through a channel you can actually reach.","Agree on scope, permissions, and what happens to their data.","Track the steps, delivery time, failure points, and customer's response."],"prompt":"What will you deliver manually, and which repeated step might deserve automation?","example":"I will prepare a reviewed missing-item summary from a permitted checklist. I will record the steps and time, then check which parts recur across jobs.","trap":"Do not disguise manual work as an autonomous AI system. Also ask whether close founder attention is masking friction that future users would face.","quiz":{"question":"A manual pilot delights a customer but takes most of your week. What does that show?","options":["The whole business is ready to scale.","Manual delivery was a mistake and taught you nothing.","The outcome may matter, while delivery cost and repeatability still need testing."],"correct":2,"explanations":["Usefulness is only one part of a viable business.","Manual work can expose exactly where time goes and what users value.","You learned something about value and something about operational limits. Keep both."]},"takeaway":"Automate the repeated work you understand."},{"id":"launch","group":"Test the offer","short":"Put the offer in reach","title":"A launch is a chance to learn, not a verdict.","author":"Kat Mañalac / Y Combinator","resource":"How to launch (again and again)","url":"https://www.ycombinator.com/library/6i-how-to-launch-again-and-again","origin":"Selected from an organization named in the reel","idea":"Show a clear offer to a relevant audience and ask for one observable next step.","paragraphs":["A launch is an opportunity to learn from putting your offer in front of people. You can do it more than once. Choose an audience that might have the problem, explain a specific outcome, and ask for a concrete action. A quiet first attempt does not tell you which part failed.","Choose a reachable audience and a specific next action. Track the path from exposure to conversation to use. Change one meaningful part of the next attempt so you can interpret the result."],"case":"A general social post gets polite reactions. A permitted post in a bookkeeper community describes the missing-receipt workflow and offers a scoped pilot. You record who asked for details, who brought a real checklist, and who actually tried the output.","distinction":["Vague launch","My AI finance app is live. Thoughts?","Clear offer","If you chase receipts during monthly close, I am testing a reviewed missing-item summary. Here is the scope and how to request a pilot."],"task":"Write a small launch with an audience and a next step.","steps":["Pick one relevant channel and follow its rules.","Describe the problem and outcome without unsupported promises.","Ask for a concrete action and decide what you will record."],"prompt":"Where will you reach the customer, what will you offer, and what action will you observe?","example":"Ask a community moderator about a pilot invitation. Explain the missing-item summary, its limits, and the permitted inputs. Record requests, completed trials, and reasons for declining separately.","trap":"A lack of replies can mean weak distribution, an unclear message, low trust, or low demand. Avoid declaring the product dead or successful from one launch.","quiz":{"question":"A broad launch gets almost no replies. What can you conclude?","options":["You need to investigate audience, message, trust, and offer before diagnosing demand.","No one has the problem.","The answer is always a larger ad budget."],"correct":0,"explanations":["The observation has several possible explanations. A narrower follow-up can separate them.","You have not shown that the right people understood and considered a credible offer.","More exposure can repeat the same targeting or message problem at greater cost."]},"takeaway":"Make the next launch easier to interpret."},{"id":"pricing","group":"Earn repeat use","short":"Make a real offer","title":"Test a price against a clear unit of value.","author":"Stripe","resource":"SaaS pricing models: a guide","url":"https://stripe.com/resources/more/saas-pricing-models-101","origin":"Added companion reading, not confirmed in the reel's list","idea":"Make clear what the customer pays for, what you will deliver, and what it costs you to deliver it.","paragraphs":["A billing unit is the thing you charge per: a person, a task, a month, or an amount of usage. Choose a unit the customer can connect to a useful result. Then test a real offer with clear scope and terms. A copied pricing table cannot tell you whether customers will pay.","A real offer tests more than asking whether a price sounds fair. State the scope, amount, billing period or unit, cancellation terms, and delivery limits. Account for service costs, including AI usage and manual review. An accepted pilot is evidence of that offer, not proof of enduring demand."],"case":"The bookkeeper might evaluate a price per client close more easily than a price per AI token. But you still need to test whether that unit fits their workflow and whether your delivery costs leave room for a business.","distinction":["Unclear offer","Pay for some AI credits and see what happens.","Inspectable offer","A defined fee for a reviewed missing-item summary, with the scope, inputs, and cancellation terms stated."],"task":"Draft an offer you could honestly deliver.","steps":["Choose a billing unit tied to how the customer works.","State the scope and any limits before asking for agreement.","List delivery costs and ask for a real next step without pressure."],"prompt":"What are you charging for, what does it cost to deliver, and what would count as acceptance?","example":"Charge per scoped close review, with an agreed checklist size and human review included. Track time and service costs. Count an agreed paid pilot separately from someone saying the price sounds reasonable.","trap":"Do not take payment for something you cannot deliver or hide automatic renewal. Cost-plus arithmetic alone does not establish willingness to pay.","quiz":{"question":"Which signal most directly tests willingness to pay for this pilot?","options":["A survey respondent says the price seems fair.","An informed customer accepts a clearly scoped paid pilot.","The pricing page looks similar to an established company's."],"correct":1,"explanations":["A reaction to a hypothetical price can differ from a real purchase decision.","A real agreement tests this offer under its stated terms. Repeat value and delivery economics remain open.","Presentation does not establish customer value or commercial demand."]},"takeaway":"Price the outcome clearly enough to be declined."},{"id":"retention","group":"Earn repeat use","short":"Find the reason to return","title":"Look for repeated value, not a launch-day spike.","author":"Rahul Vohra / First Round Review","resource":"How Superhuman Built an Engine to Find Product Market Fit","url":"https://review.firstround.com/how-superhuman-built-an-engine-to-find-product-market-fit/","origin":"Added companion reading, not confirmed in the reel's list","idea":"Look for customers using the service again when their problem happens again.","paragraphs":["A return means more when the customer had a genuine reason to need the service again. Compare people doing similar jobs at similar points in their workflow. Ask returning customers what helped and non-returners what changed or failed. Their reasons matter alongside the count.","Use surveys as one input, alongside actual use, repeat purchases, and cancellation reasons. For a small pilot, inspect individual journeys before treating percentages as reliable. The case study's survey benchmark is not a universal pass mark, so this course does not turn it into a business score."],"case":"Some bookkeepers try the summary once and disappear. Others return at the next monthly close. Weekly logins would misread this workflow. Ask what triggered the return and compare users at a relevant stage in their own cycle.","distinction":["Vanity measure","Everyone who ever signed up.","Useful observation","Which eligible users returned for the next close, what they did, and why others did not."],"task":"Define repeat value at the customer's natural cadence.","steps":["Name the event that creates another need for the product.","Define who had a real opportunity to return.","Record return behavior and ask about both useful and disappointing experiences."],"prompt":"When should a customer need this again, and what would a meaningful return look like?","example":"At the next eligible monthly close, check whether the bookkeeper requests another reviewed summary and uses it to complete the task. Ask non-returners what changed or failed.","trap":"Daily engagement is not appropriate for every product. Survey sentiment, retention, payment, and product-market fit are related questions, not interchangeable metrics.","quiz":{"question":"A monthly workflow has few daily logins. What should you check?","options":["Whether users log in every morning.","Whether the landing page needs more animation.","Whether eligible customers return and get value at the next monthly workflow."],"correct":2,"explanations":["Daily activity can be the wrong cadence for the job.","Visual polish cannot diagnose repeated usefulness by itself.","Measure return against a real opportunity to use the product, then investigate the reasons."]},"takeaway":"Measure return when the need returns."},{"id":"focus","group":"Earn repeat use","short":"Choose the next experiment","title":"Spend the week on the uncertainty that matters.","author":"Sam Altman","resource":"Startup Playbook: focus and execution","url":"https://playbook.samaltman.com/#focus","origin":"Added companion reading, not confirmed in the reel's list","idea":"Choose one test that will change your next decision. Decide in advance what you will do with its result.","paragraphs":["Your time is limited, so choose the uncertainty that could most change the plan. State what you believe, what you will observe, and when you will review it. Write down what would make you continue, change direction, or stop before you become attached to the result.","Choose a test with a time limit, a visible result, and a rule for what you will do afterward. The rule can be qualitative when evidence is sparse. Separate continue, change, and stop conditions before you become attached to the result. Sustainable effort and necessary care remain constraints."],"case":"You could add a dashboard, write a launch thread, or investigate why last month's users did not return. If repeat usefulness is the open question, contact those users and inspect the next close. Postpone the dashboard unless it helps answer that question.","distinction":["Busy week","Ship every feature people mentioned.","Learning week","Test one consequential assumption and decide what the result changes."],"task":"Write a one-week experiment and a decision rule.","steps":["State the assumption and the evidence you need.","Choose a reachable customer, action, and review date.","Name what you will postpone and what would make you continue, change, or stop."],"prompt":"What will you test next, what would change your mind, and what will you leave undone?","example":"Before next Friday, ask eligible pilot users about their next close and offer a clearly scoped repeat service. If they need it but reject the workflow, change delivery. If the problem has disappeared, reconsider the segment. Postpone the dashboard.","trap":"A busy calendar is not evidence of progress. Equally, an arbitrary tiny sample is not a statistical go/no-go rule. State what you learned and what remains uncertain.","quiz":{"question":"Which weekly plan is easiest to learn from?","options":["Test a named assumption, collect observable evidence, and review a prewritten decision rule.","Improve the app until it feels finished.","Build every requested feature and decide what it means afterward."],"correct":0,"explanations":["The plan links effort to a decision while making uncertainty explicit.","Finished is not an observable customer outcome.","Several simultaneous changes make the result harder to interpret and may exceed your capacity."]},"takeaway":"End the week with a better decision."}];
const signals=[{"text":"A friend says the idea sounds useful.","category":"opinion","why":"This is a reaction to an idea. It does not establish a recent problem, real use, or purchase.","next":"Ask for a recent example of the problem without pitching."},{"text":"A bookkeeper shows the reminder spreadsheet used at the last close.","category":"behavior","why":"You can inspect a past workaround. That supports the existence of a workflow, not willingness to switch.","next":"Check the frequency, consequence, and hardest step."},{"text":"A customer accepts a clearly scoped paid pilot.","category":"commitment","why":"They have committed resources to this offer. Delivery, repeated value, and sustainable economics remain untested.","next":"Deliver the promised outcome and inspect whether it helped."},{"text":"Someone says they would pay if you added more features.","category":"opinion","why":"A hypothetical purchase remains an opinion, even when it mentions money.","next":"Explore the last problem and make a concrete, honest offer."},{"text":"An eligible pilot user returns at the next monthly close.","category":"behavior","why":"This is observed repeat behavior. Investigate the value they received; one return is not proof of broad product-market fit.","next":"Ask what brought them back and inspect the completed task."},{"text":"A bookkeeper schedules a pilot and agrees to prepare a permitted sample checklist.","category":"commitment","why":"A specific investment of time and effort is a commitment. Verify whether it happens before treating it as completed behavior.","next":"Confirm scope and permissions, then observe the pilot."}];

function evaluateSignal(signal, answer) {
  if (!categories.includes(answer)) throw new RangeError("Choose a valid evidence category.");
  return { correct: signal.category === answer, category: signal.category, explanation: signal.why, next: signal.next };
}

function emptyProgress() {
  return { version: 1, notes: {}, recalls: {}, passed: [], completed: [], theme: "dark" };
}

function parseProgress(raw, ids) {
  const saved = JSON.parse(raw);
  if (!saved || saved.version !== 1 || typeof saved.notes !== "object" || saved.notes === null ||
      Array.isArray(saved.notes) || !Array.isArray(saved.passed) || !Array.isArray(saved.completed) ||
      !["dark", "light"].includes(saved.theme)) {
    throw new TypeError("Saved field notes have an unsupported format.");
  }
  if(saved.recalls!==undefined&&(typeof saved.recalls!=="object"||saved.recalls===null||Array.isArray(saved.recalls))) {
    throw new TypeError("Saved recall notes have an unsupported format.");
  }
  const notes = {},recalls={};
  for (const id of ids) {
    if (Object.hasOwn(saved.notes, id)) {
      if (typeof saved.notes[id] !== "string") throw new TypeError("A saved field note is not text.");
      notes[id] = saved.notes[id];
    }
    if(saved.recalls&&Object.hasOwn(saved.recalls,id)) {
      if(typeof saved.recalls[id]!=="string")throw new TypeError("A saved recall note is not text.");
      recalls[id]=saved.recalls[id];
    }
  }
  const passed = [...new Set(saved.passed.filter(id => ids.includes(id)))];
  const completed = [...new Set(saved.completed.filter(id => ids.includes(id) && passed.includes(id) && notes[id]?.trim()))];
  return { version: 1, notes, recalls, passed, completed, theme: saved.theme };
}

function canComplete(state, id) {
  return state.passed.includes(id) && Boolean(state.notes[id]?.trim());
}

function makeNotebook(lessons, state) {
  const lines = ["# Founder Fieldwork", "", "Original companion course inspired by @davecto's reel.", "The full nine-resource list was not publicly visible. This is an independently curated selection.", "", "Personal notes exported from this browser. Course completion is not business validation.", ""];
  for (const lesson of lessons) {
    lines.push(`## ${lesson.short}`, "", `${lesson.author}: ${lesson.resource}`, lesson.url, "", `Practice: ${lesson.task}`, "", state.notes[lesson.id]?.trim() || "(No note yet.)", "", `Practice complete: ${state.completed.includes(lesson.id) ? "yes" : "no"}`, "");
    if(state.recalls?.[lesson.id]?.trim())lines.push("Recall note:",state.recalls[lesson.id],"");
  }
  return lines.join("\n");
}

function parseLearningRoute(hash,ids) {
  const value=hash.replace(/^#/,"");
  if(!value||value==="course")return {view:"course"};
  if(["notebook","sources","lab"].includes(value))return {view:value};
  if(value==="resources")return {view:"sources"};
  const params=new URLSearchParams(value);
  const id=params.get("lesson"),phase=params.get("step")||"learn";
  if(ids.includes(id)&&[...lessonPhases,"done"].includes(phase))return {view:"lesson",id,phase};
  return {view:"not-found"};
}
function lessonHref(id,phase="learn") {

}

function wireEditors() {

    } else state.recalls[id]=editor.value;
    const status=editor.parentElement.querySelector(".save-state");
    if(status)status.textContent=storageAvailable&&!storageCorrupt?"Saving...":"Not saved to storage. Export before leaving.";
    clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveStatus(save()),300);
  });
}
function pageTitle(title){document.title=`${title} | Founder Fieldwork`;}
function byId(id){return lessons.find(l=>l.id===id);}
function lessonSource(l){return `<p class="lesson-source">Based on <a href="${esc(l.url)}" rel="noopener noreferrer">${esc(l.resource)}</a> by ${esc(l.author)}. <a href="#sources">Source notes</a>.</p>`;}
function renderCourse() {
  const next=nextUnfinishedLesson(lessons,state),hasWork=Object.values(state.notes).some(n=>n.trim())||Object.values(state.recalls).some(n=>n.trim())||state.passed.length>0;

  $("#view-content").innerHTML=`<section class="page course-page" aria-labelledby="course-title">
    <div class="course-intro"><p class="eyebrow">A practical founder course</p><h1 id="course-title" tabindex="-1">Learn the work after the prototype.</h1>
    <p class="course-lead">Find a real problem. Test a small offer. Learn whether people return.</p>
    <a id="start-course" class="primary" href="${start}">${allDone?"Review lesson 1":hasWork?`Continue: ${esc(learningGoals[next.id].label)}`:"Start lesson 1"}</a>
    <p class="course-guidance">Use one app or business idea throughout. Each lesson ends with one decision for your project.</p>
    ${hasWork?`<p class="course-progress">${state.completed.length} of ${lessons.length} practices complete. ${allDone?'<a href="#notebook">Review your next steps</a>.':""}</p>`:""}</div>
    <div class="course-outline">${chapters.map((chapter,index)=>`<section class="chapter" aria-labelledby="chapter-${index}"><div class="chapter-heading"><span class="chapter-number" aria-hidden="true">${index+1}</span><div><h2 id="chapter-${index}">${esc(chapter.title)}</h2><p>${esc(chapter.question)}</p></div></div>
      <ol class="lesson-menu" start="${index*3+1}">${chapter.ids.map(id=>`<li><a href="${lessonHref(id)}"><span>${esc(learningGoals[id].label)}</span><span class="lesson-menu-end">${state.completed.includes(id)?'<span class="completion-label">Complete</span>':'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M4 8H12M8 4L12 8L8 12"/></svg>'}</span></a></li>`).join("")}</ol></section>`).join("")}</div>
    <p class="course-boundary">An independently curated companion to @davecto's reel. <a href="#sources">Read the source boundary and original readings.</a></p></section>`;
}
function lessonHeader(l,phase) {
  const goal=learningGoals[l.id],index=lessons.indexOf(l);
  return `<header class="lesson-header"><a class="back-link" href="#course">All lessons</a><p class="lesson-location">Lesson ${index+1} of ${lessons.length}</p><h1 id="lesson-title" tabindex="-1">${esc(goal.label)}</h1><p class="lesson-outcome">You will leave with: ${esc(goal.artifact.toLowerCase())}.</p></header>
    <nav class="phase-nav" aria-label="Lesson steps">${lessonPhases.map((step,i)=>`<a href="${lessonHref(l.id,step)}"${step===phase?' aria-current="step"':""}><span aria-hidden="true">${i+1}</span>${["Learn","Check","Apply"][i]}</a>`).join("")}</nav>`;
}
function visualError(error) {
  console.error("OpenUI example could not render:",error);
  const warning=$("#visual-warning");
  if(warning){warning.hidden=false;warning.textContent="The interactive example could not render. The written example is still available.";}
}
function renderLearn(l) {
  const interactive=visualLessonIds.includes(l.id);
  return `<section class="lesson-phase" data-phase="learn" aria-label="Learn the idea"><p class="lesson-idea">${esc(l.idea)}</p>
    <p class="core-explanation">${esc(l.paragraphs[0])}</p>
    <section class="worked-example" aria-labelledby="example-title"><h2 id="example-title">An example</h2>${l.id==="problem"?'<p class="case-context">Our fictional product helps independent bookkeepers collect missing receipts so they can finish a client&#39;s monthly accounts.</p>':""}<p>${esc(l.case)}</p>
    ${interactive?`<div id="lesson-visual" data-lesson-visual="${l.id}" data-visual-state="loading"></div><p id="visual-warning" class="visual-error" role="alert" hidden></p>`:
    `<dl class="example-contrast"><div><dt>${esc(l.distinction[0])}</dt><dd>${esc(l.distinction[1])}</dd></div><div><dt>${esc(l.distinction[2])}</dt><dd>${esc(l.distinction[3])}</dd></div></dl>`}</section>
    <p class="lesson-caution"><strong>Keep this distinction.</strong> ${esc(l.trap)}</p>

    <div class="phase-forward"><a class="primary" href="${lessonHref(l.id,"check")}">Check your understanding</a></div>${lessonSource(l)}</section>`;

function renderCheck(l) {
  const passed=state.passed.includes(l.id);
  return `<section class="lesson-phase" data-phase="check" aria-labelledby="check-heading"><h2 id="check-heading">Explain it before you look.</h2><p>Try to answer from memory. Then compare your reasoning with the choices.</p>
    <div class="editor"><label for="recall-note">${esc(learningGoals[l.id].recall)}</label><textarea id="recall-note" data-recall="${l.id}" placeholder="A sentence or two in your own words.">${esc(state.recalls[l.id]||"")}</textarea><span class="save-state">${storageAvailable&&!storageCorrupt?"Optional recall note. Saved locally as you write.":"Not saved to storage. Export before leaving."}</span></div>
    <details id="answer-choices" class="choices"><summary>Reveal the answer choices</summary>
    <form id="lesson-quiz"><fieldset><legend>${esc(l.quiz.question)}</legend>${l.quiz.options.map((option,i)=>`<label class="answer"><input type="radio" name="answer" value="${i}" required><span>${esc(option)}</span></label>`).join("")}</fieldset>
    <button id="check-answer" class="${passed?"secondary":"primary"}" type="submit">Check answer</button><div id="quiz-feedback" class="feedback" role="status" hidden></div></form></details>
    <div id="check-next"${passed?"":" hidden"}><p class="check-passed">${passed?"You have completed this check. Apply the idea to your own project next.":""}</p><a class="primary" href="${lessonHref(l.id,"apply")}">Apply it to your project</a></div>
    <a class="quiet-back" href="${lessonHref(l.id)}">Read the explanation again</a></section>`;
}
function renderApply(l) {
  const done=state.completed.includes(l.id);
  return `<section class="lesson-phase" data-phase="apply" aria-labelledby="apply-heading"><h2 id="apply-heading">${esc(l.task)}</h2><p>This is the decision you will take back to your own project.</p>

    <details class="guidance"><summary>Need a starting point?</summary><ol>${l.steps.map(step=>`<li>${esc(step)}</li>`).join("")}</ol><h3>A fictional example</h3><p>${esc(l.example)}</p><p>Use your own situation. The example is guidance, not a note to copy.</p></details></section>`;

function renderDone(l) {
  const index=lessons.indexOf(l);
  if(!state.completed.includes(l.id))return `<section class="reader"><a class="back-link" href="#course">All lessons</a><h1 tabindex="-1">Finish the practice first.</h1><p>The summary is available after you complete the check and write a project note.</p><a class="primary" href="${lessonHref(l.id,"apply")}">Return to Apply</a></section>`;
  return `<section class="reader lesson-done"><a class="back-link" href="#course">All lessons</a><p class="eyebrow">Lesson ${index+1} complete</p><h1 id="done-title" tabindex="-1">${esc(l.takeaway)}</h1><h2>Your next step</h2><p class="saved-decision">${esc(state.notes[l.id])}</p><p class="small">This records your practice, not proof that the business works.</p><div class="phase-forward"><a class="primary" href="${index<lessons.length-1?lessonHref(lessons[index+1].id):"#notebook"}">${index<lessons.length-1?`Next: ${esc(learningGoals[lessons[index+1].id].label)}`:"Open your notebook"}</a></div><a class="quiet-back" href="${lessonHref(l.id,"apply")}">Edit your decision</a></section>`;
}
function updateFinishButton() {
  const button=$("#finish-lesson");
  if(!button||activeRoute.view!=="lesson")return;
  const id=activeRoute.id;
  button.disabled=!canComplete(state,id);
  $("#finish-hint").innerHTML=!state.passed.includes(id)?`Complete the <a href="${lessonHref(id,"check")}">Check step</a> first.`:!state.notes[id]?.trim()?"Write a decision for your project before finishing.":"Your note remains editable in Notebook.";
}
function renderLesson(l,phase) {
  pageTitle(learningGoals[l.id].label);
  if(phase==="done"){$("#view-content").innerHTML=renderDone(l);return;}
  $("#view-content").innerHTML=`<article class="reader" data-lesson="${l.id}">${lessonHeader(l,phase)}${phase==="learn"?renderLearn(l):phase==="check"?renderCheck(l):renderApply(l)}</article>`;
  if(phase==="learn"&&visualLessonIds.includes(l.id))FieldworkVisuals.mountLessonVisual($("#lesson-visual"),l.id,{onError:visualError});
  if(phase==="check")$("#lesson-quiz").addEventListener("submit",event=>{
    event.preventDefault();
    const answer=new FormData(event.currentTarget).get("answer");
    if(answer===null)return;
    const index=Number(answer),correct=index===l.quiz.correct;
    const feedback=$("#quiz-feedback");feedback.hidden=false;feedback.dataset.result=correct?"correct":"incorrect";
    feedback.textContent=`${correct?"Yes.":"Look at the evidence again."} ${l.quiz.explanations[index]}`;
    if(correct) {
      if(!state.passed.includes(l.id))state.passed.push(l.id);
      save();
      for(const input of document.querySelectorAll('#lesson-quiz input'))input.disabled=true;
      $("#check-answer").hidden=true;$("#check-next").hidden=false;
      $("#check-next .check-passed").textContent="Now make the decision for your own project.";
    }
  });
  if(phase==="apply") {
    updateFinishButton();
    $("#finish-lesson").addEventListener("click",()=>{
      if(!canComplete(state,l.id))return;
      if(!state.completed.includes(l.id))state.completed.push(l.id);
      save();location.hash=lessonHref(l.id,"done");
    });
  }
  wireEditors();
}
function download(name,text,type="text/markdown;charset=utf-8") {
  const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement("a");
  a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function preparePrint() {
  $("#print-course").innerHTML=`<h1>Founder Fieldwork</h1><p>Original teaching material, independently curated from sources named in @davecto's reel and added companion readings. The full nine-resource list was not publicly visible.</p><p>The receipt-chasing product is a fictional running example. Course completion is not business validation.</p>`+
  lessons.map(l=>`<article><h2>${esc(learningGoals[l.id].label)}</h2><p>${esc(l.author)}: <a href="${esc(l.url)}">${esc(l.resource)}</a></p><p>${esc(l.origin)}.</p><h3>Learn</h3><p>${esc(l.idea)}</p>${l.paragraphs.map(p=>`<p>${esc(p)}</p>`).join("")}<p>${esc(l.case)}</p><p>${esc(l.trap)}</p><h3>Check</h3><p>${esc(learningGoals[l.id].recall)}</p><p>${esc(state.recalls[l.id]||"(No recall note yet.)")}</p><p>${esc(l.quiz.question)}</p><ol>${l.quiz.options.map(o=>`<li>${esc(o)}</li>`).join("")}</ol><p>Answer: ${l.quiz.correct+1}. ${esc(l.quiz.explanations[l.quiz.correct])}</p><h3>Apply</h3><p>${esc(l.task)}</p><ol>${l.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><p>${esc(l.prompt)}</p><p>${esc(state.notes[l.id]||"(No project note yet.)")}</p></article>`).join("");
}
function renderNotebook() {
  pageTitle("Your notebook");
  $("#view-content").innerHTML=`<section class="page notebook-page"><a class="back-link" href="#course">Back to the course</a><h1 id="notebook-title" tabindex="-1">Your founder notebook.</h1><p class="page-lead">Review the decisions you will take back to your project. Open a lesson below to edit its note.</p>
    <div class="notebook-tools"><button class="primary" id="export-notes" type="button">Export my notes</button><button class="text-button" id="print-guide" type="button">Print the full guide</button></div>
    <p class="small">These notes stay in this browser. Export before moving devices or clearing site data. Avoid private customer details.</p>
    <div class="notebook-entries">${lessons.map((l,i)=>`<details class="notebook-entry"><summary><span>${i+1}. ${esc(learningGoals[l.id].label)}</span><span class="entry-status">${state.completed.includes(l.id)?"Complete":state.notes[l.id]?.trim()?"Draft":"No note yet"}</span></summary><div class="editor"><label for="note-${l.id}">${esc(l.prompt)}</label><textarea id="note-${l.id}" data-note="${l.id}">${esc(state.notes[l.id]||"")}</textarea><span class="save-state">${storageAvailable&&!storageCorrupt?"Saved locally as you write.":"Not saved to storage. Export before leaving."}</span></div>${state.recalls[l.id]?.trim()?`<details class="recall-review"><summary>Your recall note</summary><p>${esc(state.recalls[l.id])}</p></details>`:""}<a class="entry-lesson" href="${lessonHref(l.id,"apply")}">Return to this practice</a></details>`).join("")}</div>
    <details class="storage-tools"><summary>Storage and reset</summary><p class="small">Reset removes only this course's notes and progress from this browser. Downloaded copies are unchanged.</p>${storageCorrupt?'<button class="secondary" id="export-original" type="button">Export original saved data</button>':""}<button class="secondary" id="reset-request" type="button" aria-expanded="false">Reset this course</button><div id="reset-confirm" hidden><p>Export first if you need a copy.</p><button class="secondary" id="reset-cancel" type="button">Keep my notes</button><button class="secondary" id="reset-yes" type="button">Delete my course notes</button></div></details></section>`;
  if(storageCorrupt)$(".storage-tools").open=true;
  $("#export-notes").addEventListener("click",()=>{save();download("founder-fieldwork-notes.md",makeNotebook(lessons,state));announce("Notes exported.");});
  $("#print-guide").addEventListener("click",()=>{preparePrint();window.print();});
  if(storageCorrupt)$("#export-original").addEventListener("click",()=>{
    try{const raw=localStorage.getItem(storageKey);if(raw===null)throw new Error("The original record is no longer present.");download("founder-fieldwork-original.txt",raw,"text/plain;charset=utf-8");}
    catch(error){storageError("The original data could not be exported. Your current in-tab notes can still be exported separately.");console.error("Original note export failed:",error);}
  });
  $("#reset-request").addEventListener("click",()=>{$("#reset-confirm").hidden=false;$("#reset-request").setAttribute("aria-expanded","true");$("#reset-cancel").focus();});
  $("#reset-cancel").addEventListener("click",()=>{$("#reset-confirm").hidden=true;$("#reset-request").setAttribute("aria-expanded","false");$("#reset-request").focus();});
  $("#reset-yes").addEventListener("click",()=>{
    clearTimeout(saveTimer);
    try{localStorage.removeItem(storageKey);}catch(error){storageError("Reset failed because browser storage is blocked. The notes in this tab have not been cleared.");console.error("Reset failed:",error);return;}
    const theme=state.theme;state=emptyProgress();state.theme=theme;storageAvailable=true;storageCorrupt=false;
    $("#storage-error").hidden=true;save();renderNotebook();$("#notebook-title").focus({preventScroll:true});announce("Course notes and progress reset.");
  });
  for(const entry of document.querySelectorAll(".notebook-entry"))entry.addEventListener("toggle",()=>{if(entry.open)for(const other of document.querySelectorAll(".notebook-entry"))if(other!==entry)other.open=false;});
  wireEditors();
}
function renderSources() {
  pageTitle("Reading list");
  $("#view-content").innerHTML=`<section class="reader sources-page"><a class="back-link" href="#course">Back to the course</a><h1 tabindex="-1">Read the originals.</h1><p class="page-lead">The lessons and exercises are original teaching material. These sources carry the authors' fuller arguments.</p>
    <section class="source-boundary"><h2>What came from the reel?</h2><p>The public <a href="https://www.instagram.com/reels/DeW-3XAxxpG/" rel="noopener noreferrer">reel by @davecto</a> names Paul Graham, Y Combinator, and <em>The Mom Test</em>. It offers the complete nine-resource list through a comment-triggered message.</p><p>That full list was not visible in the inspected public material. This course is an independently curated companion, not a reconstruction of the creator's list. It selects readings from the named sources and adds Stripe, Rahul Vohra's Superhuman case study, and Sam Altman's playbook.</p><p>The receipt-chasing business is fictional. Exercises are practice, not evidence that a real business will succeed.</p></section>
    <ol class="reading-list">${lessons.map(l=>`<li><a href="${esc(l.url)}" rel="noopener noreferrer">${esc(l.resource)}</a><span>${esc(l.author)}</span><p>${esc(l.origin)}.</p></li>`).join("")}</ol><p class="small">Public titles and source pages checked on 18 October 2026. Advice is context-dependent.</p><a class="secondary" href="#lab">Try optional evidence practice</a></section>`;
}
function renderLab() {
  pageTitle("Evidence practice");
  const final=labIndex>=signals.length;
  $(".evidence-figure").hidden=final;
  $("#lab-questions").innerHTML=`<p class="eyebrow">Optional practice</p><h1 id="lab-title" tabindex="-1">What does this signal prove?</h1><p class="page-lead">An opinion, an observed behavior, and a commitment answer different questions. Sort the statement, then inspect the limit.</p>
    ${final?`<p class="lab-statement">You classified ${labCorrect} of ${signals.length} correctly on the first try.</p><p>This is practice with evidence categories, not a startup score.</p><button id="restart-lab" class="primary" type="button">Try again</button>`:
    `<p class="small">Statement ${labIndex+1} of ${signals.length}</p><p class="lab-statement">${esc(signals[labIndex].text)}</p><form id="lab-form"><fieldset><legend>Which category fits?</legend>${categories.map(c=>`<label class="answer"><input type="radio" name="category" value="${c}" required><span>${c[0].toUpperCase()+c.slice(1)}</span></label>`).join("")}</fieldset><button id="check-signal" class="primary" type="submit">Check my classification</button><div id="lab-feedback" class="feedback" role="status" hidden></div><button id="next-signal" class="primary" type="button" hidden>${labIndex===signals.length-1?"Review the practice":"Next statement"}</button></form><p class="small">Opinion: a reaction or prediction. Behavior: something that happened. Commitment: a specific investment of time, effort, or money.</p>`}`;
  if(final){$("#restart-lab").addEventListener("click",()=>{labIndex=0;labCorrect=0;renderLab();setDrawer(null);});return;}
  labChecked=false;
  $("#lab-form").addEventListener("submit",event=>{
    event.preventDefault();if(labChecked)return;
    const result=evaluateSignal(signals[labIndex],new FormData(event.currentTarget).get("category"));
    if(result.correct)labCorrect++;labChecked=true;
    const feedback=$("#lab-feedback");feedback.hidden=false;feedback.dataset.result=result.correct?"correct":"incorrect";
    feedback.innerHTML=`<p><strong>${result.correct?"That fits.":`This is ${esc(result.category)}.`}</strong> ${esc(result.explanation)}</p><p>Next: ${esc(result.next)}</p>`;
    setDrawer(result.category,result.explanation);
    $("#check-signal").hidden=true;for(const input of document.querySelectorAll("#lab-form input"))input.disabled=true;
    $("#next-signal").hidden=false;
  });
  $("#next-signal").addEventListener("click",()=>{labIndex++;renderLab();setDrawer(null);$("#lab-title").focus({preventScroll:true});});
}
function renderRoute({focus=false}={}) {
  save();FieldworkVisuals.unmountLessonVisual();
  activeRoute=parseLearningRoute(location.hash,ids);
  const lab=activeRoute.view==="lab";$("#view-content").hidden=lab;$("#lab-section").hidden=!lab;
  if(activeRoute.view==="course")renderCourse();
  else if(activeRoute.view==="lesson")renderLesson(byId(activeRoute.id),activeRoute.phase);
  else if(activeRoute.view==="notebook")renderNotebook();
  else if(activeRoute.view==="sources")renderSources();
  else if(lab)renderLab();
  else {pageTitle("Page not found");$("#view-content").innerHTML='<section class="reader"><h1 tabindex="-1">That lesson was not found.</h1><p>The link may be incomplete or out of date.</p><a class="primary" href="#course">Open the course</a></section>';}
  for(const link of document.querySelectorAll("[data-nav]")) {
    const current=link.dataset.nav==="course"?["course","lesson"].includes(activeRoute.view):activeRoute.view==="notebook";
    if(current)link.setAttribute("aria-current","page");else link.removeAttribute("aria-current");
  }
  if(focus){window.scrollTo({top:0,behavior:"instant"});const heading=$(lab?"#lab-title":"#view-content h1");if(heading)heading.focus({preventScroll:true});}
}
window.addEventListener("hashchange",()=>renderRoute({focus:true}));
window.addEventListener("pagehide",save);window.addEventListener("beforeprint",preparePrint);

const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
const parts=[...document.querySelectorAll("#cabinet-parts>[data-part]")];
const opening=Object.fromEntries(categories.map(c=>[c,0]));
let selectedDrawer=null,visible=false,frame=0,last=0;
function paintCabinet() {
  for(const part of parts){const share=opening[part.dataset.drawer]||0;part.setAttribute("transform",`translate(${cabinetMotion[0]*share} ${cabinetMotion[1]*share})`);part.classList.toggle("selected",part.dataset.drawer===selectedDrawer);}
  const sorted=[...parts].sort((a,b)=>(Number(a.dataset.key)+Number(a.dataset.lift)*(opening[a.dataset.drawer]||0))-(Number(b.dataset.key)+Number(b.dataset.lift)*(opening[b.dataset.drawer]||0)));
  for(const part of sorted)$("#cabinet-parts").append(part);
}
function tick(now) {
  const dt=last?Math.min((now-last)/1000,1/30):1/60;last=now;let moving=false;
  for(const category of categories){const target=category===selectedDrawer?1:0;opening[category]=reduceMotion.matches?target:opening[category]+(target-opening[category])*(1-Math.exp(-dt/.16));if(Math.abs(target-opening[category])<.001)opening[category]=target;else moving=true;}
  paintCabinet();frame=visible&&moving?requestAnimationFrame(tick):0;
}
function wakeCabinet(){if(reduceMotion.matches){for(const c of categories)opening[c]=c===selectedDrawer?1:0;paintCabinet();return;}if(visible&&!frame){last=0;frame=requestAnimationFrame(tick);}}
function setDrawer(category,explanation="Check your classification to open the matching drawer.") {
  if(category!==null&&!categories.includes(category))throw new RangeError("Unknown evidence category.");
  selectedDrawer=category;$("#signal-reading").textContent=explanation;wakeCabinet();
}
new IntersectionObserver(entries=>{visible=entries[entries.length-1].isIntersecting;if(!visible&&frame){cancelAnimationFrame(frame);frame=0;}else if(visible)wakeCabinet();},{rootMargin:"120px 0px"}).observe($(".cabinet-stage"));
reduceMotion.addEventListener("change",wakeCabinet);
renderRoute();
</script>
